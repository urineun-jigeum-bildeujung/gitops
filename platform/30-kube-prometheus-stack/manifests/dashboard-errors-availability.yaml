# 에러/가용성 대시보드 — "지금 뭐가 죽어있거나 자꾸 죽는가"에 집중.
# $namespace 변수를 쓴다. service 라벨은 7개 서비스 전부 "generic-service"로 동일해서
# (charts/generic-service/templates/servicemonitor.yaml relabelings) 구분이 안 되고,
# namespace는 서비스마다 달라서(auth-service, order-service...) 이걸로 필터링/그룹핑한다
# (2026-09-15 실제 Prometheus 쿼리로 확인).
#
# namespace 변수의 후보를 up{namespace=~".+"}로 뽑으면 petflow 서비스뿐 아니라
# kube-system/jenkins/observability 등 클러스터 전체 스크랩 대상이 다 섞여 들어와서
# "서비스 up/down" 패널 범례가 겹쳐서 안 읽히는 문제가 있었음(2026-09-17 실제 캡처
# 중 발견). up{job="generic-service"}로 바꾸면 7개 서비스 namespace만 정확히
# 나오고, 크래시 중인 서비스도 up=0으로 그대로 잡혀서(값이 사라지는 게 아니라
# DOWN으로 보임) 오히려 더 정확하다 — 직접 Prometheus 쿼리로 검증함.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-errors-availability
  labels:
    grafana_dashboard: "1"
data:
  errors-availability.json: |
    {
      "title": "에러 / 가용성",
      "uid": "petflow-errors-availability",
      "tags": ["petflow", "errors"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": {},
            "hide": 0
          },
          {
            "name": "namespace",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "$datasource" },
            "query": "label_values(up{job=\"generic-service\"}, namespace)",
            "refresh": 2,
            "multi": true,
            "includeAll": true,
            "current": { "text": "All", "value": "$__all" }
          }
        ]
      },
      "panels": [
        { "type": "row", "title": "가용성", "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 } },
        {
          "type": "state-timeline",
          "title": "서비스 up/down",
          "gridPos": { "h": 6, "w": 24, "x": 0, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "$datasource" },
          "fieldConfig": { "defaults": { "mappings": [
            { "type": "value", "options": { "0": { "text": "DOWN", "color": "red" } } },
            { "type": "value", "options": { "1": { "text": "UP", "color": "green" } } }
          ] }, "overrides": [] },
          "targets": [
            { "expr": "up{namespace=~\"$namespace\"}", "legendFormat": "{{namespace}}" }
          ]
        },
        { "type": "row", "title": "에러 상세", "gridPos": { "h": 1, "w": 24, "x": 0, "y": 7 } },
        {
          "type": "timeseries",
          "title": "URI별 5xx 발생 건수",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "$datasource" },
          "fieldConfig": { "defaults": { "unit": "short", "custom": { "drawStyle": "bars", "fillOpacity": 60 } }, "overrides": [] },
          "targets": [
            {
              "expr": "sum(increase(http_server_requests_seconds_count{namespace=~\"$namespace\", status=~\"5..\"}[5m])) by (namespace, uri, status)",
              "legendFormat": "{{namespace}} {{uri}} ({{status}})"
            }
          ]
        },
        { "type": "row", "title": "파드 안정성", "gridPos": { "h": 1, "w": 24, "x": 0, "y": 16 } },
        {
          "type": "timeseries",
          "title": "파드 재시작 횟수 (1시간 누적)",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 17 },
          "datasource": { "type": "prometheus", "uid": "$datasource" },
          "fieldConfig": { "defaults": { "unit": "short", "custom": { "drawStyle": "bars", "fillOpacity": 60 } }, "overrides": [] },
          "targets": [
            {
              "expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=~\"$namespace\"}[1h])) by (namespace, pod)",
              "legendFormat": "{{namespace}}/{{pod}}"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Ready 아닌 파드 수",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 17 },
          "datasource": { "type": "prometheus", "uid": "$datasource" },
          "fieldConfig": { "defaults": { "unit": "short", "custom": { "drawStyle": "bars", "fillOpacity": 60 } }, "overrides": [] },
          "targets": [
            {
              "expr": "sum(kube_pod_status_ready{namespace=~\"$namespace\", condition=\"false\"}) by (namespace)",
              "legendFormat": "{{namespace}}"
            }
          ]
        }
      ]
    }
