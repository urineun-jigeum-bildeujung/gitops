# Golden Signals + 인프라 기본 알림 규칙 8개.
# release: kube-prometheus-stack 라벨 — ServiceMonitor와 마찬가지로 Prometheus Operator의
# ruleSelector가 release 라벨 기준으로 PrometheusRule을 고르는 게 기본 동작이라, 이 라벨이
# 없으면 Prometheus가 이 규칙들을 아예 안 읽어감.
#
# runbook_url 어노테이션은 docs/runbooks/의 대응 문서를 가리킴 — 알림이 울렸을 때
# Alertmanager/Discord 메시지에 이 URL이 그대로 실려서 바로 대응 문서로 이동 가능하게 함.
#
# service 라벨 대신 namespace로 필터링/그룹핑한다 — service는 charts/generic-service의
# ServiceMonitor relabeling이 k8s Service 이름을 그대로 붙인 값인데, 7개 서비스 전부
# Service 이름이 "generic-service"로 동일해서 서비스 구분에 못 쓴다(2026-09-15 실제
# Prometheus 쿼리로 확인 — 그전엔 알림이 와도 어느 서비스인지 구분이 안 되는 상태였음).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: petflow-golden-signals
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: petflow.golden-signals
      rules:
        - alert: HighErrorRate
          expr: |
            sum(rate(http_server_requests_seconds_count{namespace=~".+-service", status=~"5.."}[5m])) by (namespace)
            /
            sum(rate(http_server_requests_seconds_count{namespace=~".+-service"}[5m])) by (namespace)
            > 0.05
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.namespace }} 5xx 에러율 5% 초과"
            description: "{{ $labels.namespace }}의 최근 5분간 5xx 에러율이 {{ $value | humanizePercentage }}입니다."
            runbook_url: "https://github.com/urineun-jigeum-bildeujung/gitops/blob/main/docs/runbooks/high-error-rate.md"

        - alert: HighLatencyP99
          expr: |
            histogram_quantile(0.99, sum(rate(http_server_requests_seconds_bucket{namespace=~".+-service"}[5m])) by (le, namespace))
            > 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }} p99 지연시간 1초 초과"
            description: "{{ $labels.namespace }}의 p99 응답시간이 {{ $value | humanizeDuration }}입니다."
            runbook_url: "https://github.com/urineun-jigeum-bildeujung/gitops/blob/main/docs/runbooks/high-latency-p99.md"

        - alert: ServiceDown
          expr: up{namespace=~".+-service"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.namespace }} 다운"
            description: "{{ $labels.namespace }}가 2분 이상 Prometheus 스크레이프에 응답하지 않습니다."
            runbook_url: "https://github.com/urineun-jigeum-bildeujung/gitops/blob/main/docs/runbooks/service-down.md"

        - alert: PodCrashLooping
          expr: |
            sum(increase(kube_pod_container_status_restarts_total{namespace=~".+-service"}[15m])) by (namespace, pod) > 3
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.pod }} 반복 재시작"
            description: "최근 15분간 {{ $value }}회 재시작했습니다 (CrashLoopBackOff 의심)."
            runbook_url: "https://github.com/urineun-jigeum-bildeujung/gitops/blob/main/docs/runbooks/pod-crash-looping.md"

        - alert: PodNotReady
          expr: |
            sum(kube_pod_status_ready{namespace=~".+-service", condition="false"}) by (namespace, pod) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.pod }} Not Ready 지속"
            description: "5분 이상 Ready 상태가 아닙니다."
            runbook_url: "https://github.com/urineun-jigeum-bildeujung/gitops/blob/main/docs/runbooks/pod-not-ready.md"

        - alert: HighMemoryUsage
          expr: |
            sum(container_memory_working_set_bytes{namespace=~".+-service", container!="", container!="POD"}) by (namespace, pod)
            /
            sum(kube_pod_container_resource_limits{namespace=~".+-service", resource="memory"}) by (namespace, pod)
            > 0.9
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.pod }} 메모리 사용률 90% 초과"
            description: "메모리 limit 대비 사용률이 {{ $value | humanizePercentage }}입니다. OOMKilled 위험."
            runbook_url: "https://github.com/urineun-jigeum-bildeujung/gitops/blob/main/docs/runbooks/high-memory-usage.md"

        - alert: HighCPUUsage
          expr: |
            sum(rate(container_cpu_usage_seconds_total{namespace=~".+-service", container!="", container!="POD"}[5m])) by (namespace, pod)
            /
            sum(kube_pod_container_resource_limits{namespace=~".+-service", resource="cpu"}) by (namespace, pod)
            > 0.9
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.pod }} CPU 사용률 90% 초과"
            description: "CPU limit 대비 사용률이 {{ $value | humanizePercentage }}로 10분 이상 지속됩니다. Throttling 위험."
            runbook_url: "https://github.com/urineun-jigeum-bildeujung/gitops/blob/main/docs/runbooks/high-cpu-usage.md"

        - alert: HikariCPConnectionPoolExhausted
          expr: |
            hikaricp_connections_active{namespace=~".+-service"} >= hikaricp_connections_max{namespace=~".+-service"}
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.namespace }} DB 커넥션 풀 고갈"
            description: "{{ $labels.namespace }}의 HikariCP 활성 커넥션이 5분 이상 최대치에 도달해 있습니다."
            runbook_url: "https://github.com/urineun-jigeum-bildeujung/gitops/blob/main/docs/runbooks/hikaricp-pool-exhausted.md"
