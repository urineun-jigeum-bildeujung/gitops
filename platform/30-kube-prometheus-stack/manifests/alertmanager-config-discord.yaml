# Discord 인프라 채널로 알림을 보내는 라우팅 — AlertmanagerConfig CRD를 씀.
#
# 처음엔 alertmanager.config(raw string, application.yaml)에 discord_configs를
# 직접 넣고 webhook_url_file로 시크릿 파일을 참조하려 했는데, 이 kube-prometheus-stack
# 버전(90.0.0)에 딸려오는 Prometheus Operator가 그 raw config를 자체 파싱할 때 쓰는
# 내부 타입이 webhook_url_file을 아직 모름
# ("field webhook_url_file not found in type alertmanager.discordConfig") — Alertmanager
# 바이너리(0.34.0) 자체는 지원해도 Operator가 먼저 막아버림. 그래서 CRD 방식으로 바꿈:
# AlertmanagerConfig의 discordConfigs[].apiURL은 SecretKeySelector라 시크릿을 네이티브로
# 참조하고, 이건 Operator가 정식으로 지원하는 경로라 문제없다.
#
# alertmanagerConfigMatcherStrategy를 None으로 꺼놔서(application.yaml 참고), 이
# route는 이 오브젝트가 있는 네임스페이스(observability)로 자동 제한되지 않고 전체
# 알림에 다 적용된다 — 지금은 팀 구분 없이 전부 인프라 채널로 보내는 게 목적이라 의도한 동작.
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: discord-infra
  namespace: observability
spec:
  route:
    receiver: discord-infra
    # groupBy에서 namespace를 뺐다(2026-09-30, 원래는 ["alertname", "namespace"]였음) —
    # 실측(Alertmanager alertmanager_notifications_failed_total 메트릭)으로 디스코드
    # 웹훅이 85번 시도 중 6번 429(rate limit)로 실패한 걸 발견했는데, 원인이 ServiceDown
    # 같은 알림이 여러 서비스에서 동시에 뜨면 namespace별로 전부 따로따로 별개 디스코드
    # 메시지를 쏘는 구조였기 때문. Alertmanager는 429를 재시도 안 하는 에러로 취급해서
    # (repeatInterval이 4h라) 실패하면 그 알림은 사실상 오랫동안 다시 안 감.
    # alertname만으로 묶으면 "ServiceDown 3건"이 메시지 1개로 합쳐져서 동시 요청 수 자체가
    # 줄어든다 — 메시지 템플릿(message, 아래)이 이미 {{ range .Alerts }}로 알림 여러 개를
    # 한 메시지 안에 나열하게 돼 있어서 정보 손실 없음. 대신 title의
    # {{ .CommonLabels.namespace }}는 그룹 안 알림들의 namespace가 서로 다르면 빈 값이
    # 되므로(CommonLabels는 "그룹 내 전부 동일한 라벨"만 남음), title 템플릿도 그 경우엔
    # namespace 부분을 아예 생략하도록 조건문으로 바꿨다(아래 discordConfigs.title 참고).
    groupBy: ["alertname"]
    # 같은 이유로 groupWait도 30s→1m으로 늘려서, 짧은 시간 안에 여러 알림이 동시에 뜰 때
    # 더 많이 한 메시지로 묶일 시간을 줌(첫 전송까지 기다리는 시간이 길어질 뿐, 알림 자체가
    # 늦게 뜨는 건 아님 — 알림 발생 자체는 alert-rules.yaml의 for: 조건으로 이미 결정됨).
    groupWait: 1m
    groupInterval: 5m
    repeatInterval: 4h
    # matcherStrategy가 None이라 이 route가 전체 알림(kube-prometheus-stack 기본 제공
    # 알림 수십 개 포함)에 다 걸린다. 2026-09-29에 실제로 그 상태로 한 번 반영했다가
    # 우리가 직접 만든 것도 아니고 이 dev 클러스터엔 안 맞는 알림들(예: EKS 관리형
    # 컨트롤플레인이라 절대 안 꺼지는 kube-scheduler/controller-manager 알림 등)까지
    # 전부 쏟아져서, 우리가 실제로 작성한 골든시그널 알림 8개(petflow-golden-signals,
    # alert-rules.yaml)로만 명시적으로 한정한다. 새 알림 규칙을 추가하면 여기 정규식에도
    # 같이 추가해야 디스코드로 나간다.
    #
    # FrontendJsErrorSpike/FrontendOrderApiFailureSustained(2026-09-30 추가,
    # platform/30-loki/manifests/frontend-alert-rules.yaml)는 프론트엔드팀 전용
    # 알림이라 원래는 별도 채널로 가야 맞았는데, 웹훅이 없어서 한동안 여기(인프라
    # 채널)로 임시로 같이 받았다. 2026-09-30에 프론트엔드팀 웹훅 권한을 받아서
    # 아래 routes 하위의 discord-frontend receiver로 분리했다 — 이 매처(discord-infra)
    # 에서는 두 알림 이름을 뺐다.
    matchers:
      - name: alertname
        matchType: "=~"
        value: "HighErrorRate|HighLatencyP99|ServiceDown|PodCrashLooping|PodNotReady|HighMemoryUsage|HighCPUUsage|HikariCPConnectionPoolExhausted"
    # 팀별 채널 요청이 오면 여기 routes 밑에 matchers(예: namespace)로 특정 알림만
    # 골라내는 하위 route + 전용 receiver를 추가하면 된다.
    routes:
      - receiver: discord-frontend
        matchers:
          - name: alertname
            matchType: "=~"
            value: "FrontendJsErrorSpike|FrontendOrderApiFailureSustained"
  receivers:
    - name: discord-infra
      discordConfigs:
        # 2026-09-29: "클라우드 인프라" 팀 채널 웹훅을 만들 권한을 아직 못 받아서,
        # 사용자 개인 디스코드로 임시 연결해 알림 흐름 자체만 먼저 검증한다. 팀 채널
        # 권한 받으면 AWS Secrets Manager 값(petflow/observability/discord-webhook-infra)만
        # 교체하면 되고 이 파일은 다시 건드릴 필요 없다.
        - apiURL:
            name: alertmanager-discord-webhook
            key: webhook-url
          sendResolved: true
          # Alertmanager 기본 템플릿은 영어에 KST 시각 표기가 없어서 커스텀함.
          # Go 표준 템플릿엔 타임존 변환 함수가 없어서, StartsAt/EndsAt(UTC)에
          # 9시간(32400000000000ns=time.Duration)을 직접 더해 KST로 맞춘다.
          #
          # groupBy에서 namespace를 뺐기 때문에(위 route 주석 참고), 같은 알림이 여러
          # namespace에서 동시에 뜨면 .CommonLabels.namespace가 빈 값이 된다(그룹 내
          # 알림들의 namespace가 서로 달라서 "공통 라벨"이 아니게 됨) — 그 경우 제목에서
          # namespace 부분을 통째로 생략한다. namespace별 상세 내용은 message 본문에서
          # 알림별로 다 보여주므로 정보 손실은 없음.
          title: '{{ if eq .Status "firing" }}🔴 알림 발생{{ else }}✅ 알림 해소{{ end }}{{ if .CommonLabels.namespace }} · {{ .CommonLabels.namespace }}{{ end }} · {{ .CommonLabels.alertname }}'
          message: |-
            {{ range .Alerts }}
            **상태**: {{ if eq .Status "firing" }}🔴 발생 중{{ else }}✅ 해소됨{{ end }}
            **요약**: {{ .Annotations.summary }}
            **설명**: {{ .Annotations.description }}
            **발생 시각(KST)**: {{ (.StartsAt.Add 32400000000000).Format "2006-01-02 15:04:05" }}
            {{ if eq .Status "resolved" }}**해소 시각(KST)**: {{ (.EndsAt.Add 32400000000000).Format "2006-01-02 15:04:05" }}
            {{ end -}}
            {{ if .Annotations.runbook_url }}**대응 방법**: {{ .Annotations.runbook_url }}{{ end }}
            {{ end }}
    # 2026-09-30: 프론트엔드팀 실제 채널 웹훅 권한을 받아서 분리한 receiver.
    # discord-infra와 title/message 템플릿은 동일하게 맞추고 apiURL만 다른 시크릿
    # (alertmanager-discord-webhook-frontend, app-bindings-observability.yaml 참고)을 쓴다.
    - name: discord-frontend
      discordConfigs:
        - apiURL:
            name: alertmanager-discord-webhook-frontend
            key: webhook-url
          sendResolved: true
          title: '{{ if eq .Status "firing" }}🔴 알림 발생{{ else }}✅ 알림 해소{{ end }}{{ if .CommonLabels.namespace }} · {{ .CommonLabels.namespace }}{{ end }} · {{ .CommonLabels.alertname }}'
          message: |-
            {{ range .Alerts }}
            **상태**: {{ if eq .Status "firing" }}🔴 발생 중{{ else }}✅ 해소됨{{ end }}
            **요약**: {{ .Annotations.summary }}
            **설명**: {{ .Annotations.description }}
            **발생 시각(KST)**: {{ (.StartsAt.Add 32400000000000).Format "2006-01-02 15:04:05" }}
            {{ if eq .Status "resolved" }}**해소 시각(KST)**: {{ (.EndsAt.Add 32400000000000).Format "2006-01-02 15:04:05" }}
            {{ end -}}
            {{ if .Annotations.runbook_url }}**대응 방법**: {{ .Annotations.runbook_url }}{{ end }}
            {{ end }}
