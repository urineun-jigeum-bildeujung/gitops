apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  sources:
    - chart: kube-prometheus-stack
      repoURL: https://prometheus-community.github.io/helm-charts
      targetRevision: "90.0.0" # 2026-09-08 기준 최신 안정 버전
      helm:
        releaseName: kube-prometheus-stack
        values: |
          defaultRules:
            rules:
              # EKS는 컨트롤플레인을 관리형으로 숨겨서 kube-controller-manager/kube-scheduler를
              # Prometheus가 긁어갈 대상 자체가 없다. 이 두 규칙그룹의 알림은
              # absent(up{job="..."})라 절대 해소되지 않고 영원히 계속 울린다
              # (2026-09-29 실제로 계속 firing 상태인 것 확인) — EKS에서는 의미 없는
              # 알림이라 통째로 끈다.
              kubeControllerManager: false
              kubeSchedulerAlerting: false
          prometheus:
            prometheusSpec:
              # 차트 기본값은 영구 저장소가 없는 emptyDir이라, 파드가 재스케줄될
              # 때마다(노드 교체, Karpenter consolidation 등) 메트릭·알림 이력이
              # 전부 사라진다(2026-10-01 실제로 겪음 — 사후 장애 조사 자체가
              # 막혔음). Grafana/Loki와 동일하게 PVC를 붙여 재시작을 버티게 한다.
              retention: 15d
              storageSpec:
                volumeClaimTemplate:
                  spec:
                    storageClassName: gp3
                    accessModes:
                      - ReadWriteOnce
                    resources:
                      requests:
                        storage: 20Gi
          grafana:
            enabled: true
            # Argo CD가 Helm chart를 렌더링할 때마다 관리자 Secret의 랜덤값이
            # 바뀌면 PVC의 Grafana DB 비밀번호와 Kubernetes Secret이 어긋난다.
            # AWS Secrets Manager를 원본으로 하는 ExternalSecret을 참조해
            # 재동기화와 클러스터 재생성 뒤에도 같은 관리자 계정을 사용한다.
            admin:
              existingSecret: grafana-admin-credentials
              userKey: admin-user
              passwordKey: admin-password
            # Grafana 사용자/설정을 Pod 재생성 후에도 유지한다.
            persistence:
              enabled: true
              type: sts
              storageClassName: gp3
              accessModes:
                - ReadWriteOnce
              size: 5Gi
            grafana.ini:
              auth.anonymous:
                enabled: false
              users:
                allow_sign_up: false
            # Grafana 13부터 prometheus 데이터소스 플러그인이 이미지 안 읽기전용
            # 경로(/usr/share/grafana/data/plugins-bundled)에 번들로만 들어있는데,
            # 이 파드가 readOnlyRootFilesystem으로 뜨면서 부팅 시 그 플러그인을
            # 최신 버전으로 자동 갱신하려다 쓰기 실패 -> 기존 프로세스까지 죽어서
            # Prometheus 데이터소스 자체가 고장남(2026-09-15 실제로 겪음, 모든
            # 대시보드 패널이 No data). shadowBundledPlugins로 그 경로를 쓰기
            # 가능한 emptyDir로 덮어쓰고, 필요한 플러그인만 plugins:에 명시해서
            # 정상 설치 경로(/var/lib/grafana/plugins)로 새로 받게 한다.
            shadowBundledPlugins: true
            # loki/tempo도 prometheus와 같은 이유(Grafana 13에서 코어 분리)로
            # shadowBundledPlugins 대상에 포함해야 데이터소스로 추가했을 때
            # 똑같이 고장나지 않는다.
            plugins:
              - prometheus
              - loki
              - tempo
            # Loki/Tempo를 실제 데이터소스로 등록 + 로그<->트레이스 상호 연결(derived
            # field/tracesToLogs). 2026-09-17: 7개 서비스에 LOGGING_PATTERN_LEVEL을 추가해서
            # 실제 로그에 찍히는 필드 이름이 OTel Java agent MDC 키 그대로인 trace_id(snake_case)
            # 인 걸 확인 — 기존 traceId(camelCase) 정규식은 매칭이 안 되는 상태였음.
            #
            # url의 $${__value.raw}는 $$가 맞다(오타 아님) — Grafana 프로비저닝 시스템은
            # ${...}를 전부 "환경변수 치환 대상"으로 먼저 해석해버려서, ${__value.raw}를
            # 그대로 쓰면 존재하지 않는 환경변수로 취급돼 빈 문자열로 치환됨(실제 Grafana
            # API로 확인 — url이 ""로 저장돼 있었음). $$로 이스케이프해야 Explore가 런타임에
            # 해석하는 ${__value.raw} 리터럴이 그대로 살아남는다.
            additionalDataSources:
              - name: Loki
                type: loki
                access: proxy
                uid: loki
                url: http://loki-gateway.observability.svc.cluster.local
                jsonData:
                  derivedFields:
                    - datasourceUid: tempo
                      matcherRegex: "trace_id=(\\w+)"
                      name: TraceID
                      url: "$${__value.raw}"
              - name: Tempo
                type: tempo
                access: proxy
                uid: tempo
                url: http://tempo.observability.svc.cluster.local:3200
                jsonData:
                  tracesToLogsV2:
                    datasourceUid: loki
                    spanStartTimeShift: "-5m"
                    spanEndTimeShift: "5m"
                    filterByTraceID: true
          alertmanager:
            alertmanagerSpec:
              # AlertmanagerConfig CRD(platform/30-kube-prometheus-stack/manifests/
              # alertmanager-config-discord.yaml)가 자동으로 병합되게 함 — selector를
              # 비워두면(matchLabels 없음) 네임스페이스/라벨 상관없이 전부 매칭.
              alertmanagerConfigSelector: {}
              alertmanagerConfigNamespaceSelector: {}
              # 기본 전략(OnNamespace)은 AlertmanagerConfig의 route에 "그 오브젝트가
              # 있는 네임스페이스"라는 matcher를 자동으로 끼워 넣는다. 우리 AlertmanagerConfig는
              # observability에 두지만 실제 알림(PrometheusRule)들은 서비스별 네임스페이스에서
              # 오므로, 그 자동 matcher가 붙으면 알림이 전부 안 걸러지게 된다. None으로 꺼서
              # matcher를 AlertmanagerConfig 쪽에서 직접(또는 지금처럼 아예 없이) 관리한다.
              alertmanagerConfigMatcherStrategy:
                type: None
            config:
              # receivers만 최소로 유지 — 실제 라우팅(디스코드 등)은 AlertmanagerConfig
              # CRD가 담당한다. 그 CRD가 매칭 안 하는 알림은 이 기본 route(receiver: "null")로
              # 떨어져 조용히 무시된다.
              receivers:
                - name: "null"
    # Golden Signals/JVM/에러 대시보드(ConfigMap, grafana sidecar가 자동 로드)와
    # 알림 규칙(PrometheusRule)은 차트 values로 넣기엔 너무 커서 별도 소스로 분리.
    # Jenkins Application(platform/40-jenkins)의 kaniko ServiceAccount와 같은 패턴.
    - repoURL: https://github.com/urineun-jigeum-bildeujung/gitops.git
      targetRevision: main
      path: platform/30-kube-prometheus-stack/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
