apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  sources:
    - chart: kube-prometheus-stack
      repoURL: https://prometheus-community.github.io/helm-charts
      targetRevision: "90.0.0" # 2026-09-08 기준 최신 안정 버전
      helm:
        releaseName: kube-prometheus-stack
        values: |
          grafana:
            enabled: true
            # Grafana 사용자/설정을 Pod 재생성 후에도 유지한다.
            persistence:
              enabled: true
              type: sts
              storageClassName: gp3
              accessModes:
                - ReadWriteOnce
              size: 5Gi
            grafana.ini:
              auth.anonymous:
                enabled: false
              users:
                allow_sign_up: false
            # Grafana 13부터 prometheus 데이터소스 플러그인이 이미지 안 읽기전용
            # 경로(/usr/share/grafana/data/plugins-bundled)에 번들로만 들어있는데,
            # 이 파드가 readOnlyRootFilesystem으로 뜨면서 부팅 시 그 플러그인을
            # 최신 버전으로 자동 갱신하려다 쓰기 실패 -> 기존 프로세스까지 죽어서
            # Prometheus 데이터소스 자체가 고장남(2026-09-15 실제로 겪음, 모든
            # 대시보드 패널이 No data). shadowBundledPlugins로 그 경로를 쓰기
            # 가능한 emptyDir로 덮어쓰고, 필요한 플러그인만 plugins:에 명시해서
            # 정상 설치 경로(/var/lib/grafana/plugins)로 새로 받게 한다.
            shadowBundledPlugins: true
            # loki/tempo도 prometheus와 같은 이유(Grafana 13에서 코어 분리)로
            # shadowBundledPlugins 대상에 포함해야 데이터소스로 추가했을 때
            # 똑같이 고장나지 않는다.
            plugins:
              - prometheus
              - loki
              - tempo
            # Loki/Tempo를 실제 데이터소스로 등록 + 로그<->트레이스 상호 연결(derived
            # field/tracesToLogs). 2026-09-17: 7개 서비스에 LOGGING_PATTERN_LEVEL을 추가해서
            # 실제 로그에 찍히는 필드 이름이 OTel Java agent MDC 키 그대로인 trace_id(snake_case)
            # 인 걸 확인 — 기존 traceId(camelCase) 정규식은 매칭이 안 되는 상태였음.
            #
            # url의 $${__value.raw}는 $$가 맞다(오타 아님) — Grafana 프로비저닝 시스템은
            # ${...}를 전부 "환경변수 치환 대상"으로 먼저 해석해버려서, ${__value.raw}를
            # 그대로 쓰면 존재하지 않는 환경변수로 취급돼 빈 문자열로 치환됨(실제 Grafana
            # API로 확인 — url이 ""로 저장돼 있었음). $$로 이스케이프해야 Explore가 런타임에
            # 해석하는 ${__value.raw} 리터럴이 그대로 살아남는다.
            additionalDataSources:
              - name: Loki
                type: loki
                access: proxy
                uid: loki
                url: http://loki-gateway.observability.svc.cluster.local
                jsonData:
                  derivedFields:
                    - datasourceUid: tempo
                      matcherRegex: "trace_id=(\\w+)"
                      name: TraceID
                      url: "$${__value.raw}"
              - name: Tempo
                type: tempo
                access: proxy
                uid: tempo
                url: http://tempo.observability.svc.cluster.local:3200
                jsonData:
                  tracesToLogsV2:
                    datasourceUid: loki
                    spanStartTimeShift: "-5m"
                    spanEndTimeShift: "5m"
                    filterByTraceID: true
          alertmanager:
            alertmanagerSpec:
              # AWS Secrets Manager(petflow/observability/discord-webhook-infra)의 값을
              # ExternalSecret(platform/91-external-secrets-config/manifests/
              # app-bindings-observability.yaml)이 이 이름의 K8s Secret으로 만들어두면,
              # Prometheus Operator가 /etc/alertmanager/secrets/<시크릿이름>/ 아래에
              # 그대로 마운트해준다. 웹훅 URL 자체는 git에 절대 평문으로 올라가지 않는다.
              secrets:
                - alertmanager-discord-webhook
            config:
              route:
                receiver: "discord-infra"
                group_by: ["alertname", "namespace"]
                group_wait: 30s
                group_interval: 5m
                repeat_interval: 4h
                # 팀별 요청이 들어오면 여기 routes 밑에 team/namespace 라벨 매칭 조건과
                # 전용 receiver를 추가하면 된다. 지금은 전부 인프라 채널 하나로만 받는다.
                routes: []
              receivers:
                # 외부 알림 없이 기본 route가 참조할 수 있는 대기 Receiver(특정 알림만
                # 조용히 묵음 처리하고 싶을 때 쓸 자리로 남겨둠).
                - name: "null"
                - name: "discord-infra"
                  discord_configs:
                    # 2026-09-29: "클라우드 인프라" 팀 채널 웹훅 만들 권한을 아직 못 받아서,
                    # 사용자 개인 디스코드로 임시 연결해 알림 흐름 자체만 먼저 검증한다.
                    # 팀 채널 웹훅 권한 받으면 AWS Secrets Manager 값만 교체하면 되고
                    # gitops 코드는 다시 건드릴 필요 없다(gateway-secret과 동일한 패턴).
                    - webhook_url_file: /etc/alertmanager/secrets/alertmanager-discord-webhook/webhook-url
                      send_resolved: true
    # Golden Signals/JVM/에러 대시보드(ConfigMap, grafana sidecar가 자동 로드)와
    # 알림 규칙(PrometheusRule)은 차트 values로 넣기엔 너무 커서 별도 소스로 분리.
    # Jenkins Application(platform/40-jenkins)의 kaniko ServiceAccount와 같은 패턴.
    - repoURL: https://github.com/urineun-jigeum-bildeujung/gitops.git
      targetRevision: main
      path: platform/30-kube-prometheus-stack/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
