# Redis 기본 사용자의 비밀번호 없는 접속을 차단한 뒤 Access Entry 그룹을 연결한다.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: security-redis-port-forward
  namespace: redis
rules:
  - apiGroups: [""]
    resources: ["pods/portforward"]
    resourceNames: ["redis-master-0"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: security-redis-port-forward
  namespace: redis
subjects:
  - kind: Group
    name: petflow-redis-port-forward
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: security-redis-port-forward
  apiGroup: rbac.authorization.k8s.io
