# EKS Access Entry의 petflow-prometheus-port-forward 그룹에만 Prometheus UI 접속을 허용한다.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: security-prometheus-port-forward
  namespace: observability
rules:
  - apiGroups: [""]
    resources: ["pods/portforward"]
    resourceNames: ["prometheus-kube-prometheus-stack-prometheus-0"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: security-prometheus-port-forward
  namespace: observability
subjects:
  - kind: Group
    name: petflow-prometheus-port-forward
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: security-prometheus-port-forward
  apiGroup: rbac.authorization.k8s.io
