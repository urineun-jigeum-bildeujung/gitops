apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiFamily: AL2023
  # EKS 1.35 MNG에서 검증된 이미지로 고정한다. 자동 latest 갱신은 하지 않는다.
  amiSelectorTerms:
    - id: ami-0aadb3cf154aff503
  role: petflow-dev-karpenter-node
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: petflow-eks
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: petflow-eks
  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 1
    httpTokens: required
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 50Gi
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true
  tags:
    Project: petflow
    Environment: dev
    ManagedBy: karpenter
