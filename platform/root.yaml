# platform 레이어의 App-of-apps root.
# 모든 깊이에서 application.yaml 파일만 sync (더블스타 glob 사용).
# sync-wave annotation은 같은 platform root 동기화 범위에서 CRD → operator → workload 순서를 조정한다.
#
# 주의: `directory.include`에 `{a,b,c}` 같은 중괄호(brace expansion) 문법은 ArgoCD가
# 지원하지 않는다 — 이 문법을 쓰면 매칭이 안 돼서 자식이 0개 생성되는 버그가 발생할 수 있다.
# 반드시 `**/application.yaml` 같은 더블스타(glob) 패턴을 써야 한다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://github.com/urineun-jigeum-bildeujung/gitops.git
    targetRevision: main
    path: platform
    directory:
      recurse: true
      include: "**/application.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  # alloy 차트(k8s-monitoring)가 pre-delete Helm hook을 갖고 있어서, ArgoCD가 그 훅
  # 실행을 보장하려고 alloy Application 리소스에 pre-delete-finalizer.argocd.argoproj.io
  # 계열 finalizer 2개를 스스로 추가함(2026-10-01 확인). git에는 선언하지 않은 값이라
  # platform-root가 이걸 영구 OutOfSync로 봄 — ArgoCD 자신이 만든 drift라 selfHeal로도
  # 없어지지 않으므로, 비교 대상에서 이 필드만 제외한다.
  ignoreDifferences:
    - group: argoproj.io
      kind: Application
      name: alloy
      jsonPointers:
        - /metadata/finalizers
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
