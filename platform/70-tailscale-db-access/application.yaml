# Operator와 CRD가 준비된 뒤 DB 전용 Tailnet Service를 생성한다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tailscale-db-access
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://github.com/urineun-jigeum-bildeujung/gitops.git
    targetRevision: main
    path: platform/70-tailscale-db-access/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: database
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
