# ClusterSecretStore — AWS Secrets Manager를 시크릿 백엔드로 등록.
# 모든 네임스페이스의 ExternalSecret이 이 store를 spec.secretStoreRef로 참조.
#
# 인증 방식: IRSA(IAM Roles for Service Accounts) 사용 예정.
# (참고: Troika 팀은 self-managed kubeadm이라 OIDC provider가 없어서 EC2 node IAM role로
#  우회했지만, 우리는 EKS라 이 서비스 어카운트 하나에만 IAM Role을 붙이는 IRSA가 가능 —
#  노드 전체가 아니라 이 오퍼레이터만 권한을 갖게 되어 더 안전함.)
#
# TODO (뼈대 단계라 미완성):
#   - IAM Role 생성: secretsmanager:GetSecretValue 권한,
#     리소스 범위는 arn:aws:secretsmanager:ap-northeast-2:<account>:secret:pet-subscription/* 로 제한 권장
#   - external-secrets 서비스 어카운트에 eks.amazonaws.com/role-arn 어노테이션으로 IAM Role 연결
#   - 서비스별 ExternalSecret/ConfigMap 바인딩은 서비스 확정 후 이 폴더에 추가
#     (파일명 컨벤션 예: app-bindings-<service>.yaml)
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-northeast-2
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets # TODO: 실제 ServiceAccount 이름 확인 후 수정
            namespace: external-secrets
