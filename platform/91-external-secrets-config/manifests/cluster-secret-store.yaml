# ClusterSecretStore — AWS Secrets Manager를 시크릿 백엔드로 등록.
# 모든 네임스페이스의 ExternalSecret이 이 store를 spec.secretStoreRef로 참조.
#
# 인증 방식: EKS Pod Identity (프로젝트 표준, IRSA/OIDC 아님 — platform-iam 모듈의
# ALB Controller/Karpenter와 동일한 방식).
#
# provider.aws에 auth 블록을 아예 안 씀 — Pod Identity는 IRSA처럼 ServiceAccount에
# 토큰/어노테이션을 거는 방식이 아니라, AWS SDK 기본 자격증명 체인에 자동으로 자격증명을
# 주입하는 방식이라 별도 auth 설정이 필요 없음. 대신 아래 조건이 맞아야 실제로 동작함:
#   - external-secrets 오퍼레이터가 이 store가 참조 가능한 IAM 권한을 갖고 있어야 함
#     (namespace: external-secrets, ServiceAccount: external-secrets — 이 이름은 차트를
#     실제 렌더링해서 확인함, 2026-09-09)
#   - 이 SA에 secretsmanager:GetSecretValue 권한을 가진 IAM Role을 EKS Pod Identity로
#     연결해야 함 — infra팀에 별도 요청 필요 (jenkins-kaniko 때와 같은 패턴)
#
# TODO (뼈대 단계라 미완성):
#   - 위 Pod Identity association을 infra팀(platform-iam 모듈)에 요청
#   - IAM Role의 리소스 범위는 arn:aws:secretsmanager:ap-northeast-2:<account>:secret:pet-subscription/* 로 제한 권장
#   - 서비스별 ExternalSecret/ConfigMap 바인딩은 서비스 확정 후 이 폴더에 추가
#     (파일명 컨벤션 예: app-bindings-<service>.yaml)
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-northeast-2
