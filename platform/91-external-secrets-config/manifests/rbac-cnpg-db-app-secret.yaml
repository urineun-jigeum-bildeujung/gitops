# CNPG가 자동 생성하는 petflow-db-app 시크릿(database 네임스페이스)을 각 서비스
# 네임스페이스의 ESO(Kubernetes provider SecretStore)가 읽어갈 수 있게 하는 RBAC.
#
# 이건 AWS Secrets Manager/Pod Identity와 무관하다 — CNPG Operator가 자체적으로
# 만드는 시크릿을 클러스터 안에서 네임스페이스 경계만 넘겨 재사용하는 것뿐이라,
# infra팀의 external-secrets Pod Identity 작업(플랫폼-iam 모듈, 별도 요청 중)을
# 기다릴 필요가 없다. 권한은 이 시크릿 하나로만 최소 범위 고정(resourceNames).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-read-db-app-secret
  namespace: database
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["petflow-db-app"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-read-db-app-secret
  namespace: database
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eso-read-db-app-secret
subjects:
  - kind: ServiceAccount
    name: eso-db-reader
    namespace: member-service
  - kind: ServiceAccount
    name: eso-db-reader
    namespace: order-service
  - kind: ServiceAccount
    name: eso-db-reader
    namespace: product-service
  - kind: ServiceAccount
    name: eso-db-reader
    namespace: review-service
