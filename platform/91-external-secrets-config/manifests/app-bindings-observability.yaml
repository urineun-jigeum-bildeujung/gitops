# Alertmanager -> Discord 인프라 채널 알림용 웹훅 URL.
# AWS Secrets Manager(petflow/observability/discord-webhook-infra)의 값을 observability
# 네임스페이스의 K8s Secret으로 가져온다. gateway-secret/oauth2-credentials와 동일한
# provider.aws/ClusterSecretStore(aws-secrets-manager) 패턴.
#
# 2026-09-29에 "클라우드 인프라" 팀 채널 웹훅 권한이 없어 개인 디스코드로 임시
# 연결했었는데, 2026-09-30에 팀 채널 웹훅 권한을 받아서 AWS Secrets Manager 값을
# 실제 팀 채널 웹훅으로 교체했다(이 파일/platform/30-kube-prometheus-stack은
# 안 건드림 — ExternalSecret refreshInterval 1h + Alertmanager가 파일 변경 자동 감지).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-discord-webhook
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: alertmanager-discord-webhook
    creationPolicy: Owner
  data:
    - secretKey: webhook-url
      remoteRef:
        key: petflow/observability/discord-webhook-infra
---
# Grafana chart가 랜덤 관리자 Secret을 다시 렌더링하지 않도록 AWS Secrets Manager의
# 고정 자격증명을 가져온다. 실제 값은 Git에 저장하지 않는다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin-credentials
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: grafana-admin-credentials
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef:
        key: petflow/grafana/admin-credentials
        property: admin-user
    - secretKey: admin-password
      remoteRef:
        key: petflow/grafana/admin-credentials
        property: admin-password
---
# 2026-09-30: 프론트엔드팀 웹훅 권한을 받아서 FrontendJsErrorSpike/
# FrontendOrderApiFailureSustained 2개 알림을 인프라 채널에서 분리한다
# (alertmanager-config-discord.yaml의 discord-frontend receiver 참고).
# AWS Secrets Manager 값(petflow/observability/discord-webhook-frontend)만
# 실제 웹훅 URL로 채워져 있으면 되고, 이 파일은 다시 건드릴 필요 없다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-discord-webhook-frontend
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: alertmanager-discord-webhook-frontend
    creationPolicy: Owner
  data:
    - secretKey: webhook-url
      remoteRef:
        key: petflow/observability/discord-webhook-frontend
