# order-service가 CNPG(petflow-db, database 네임스페이스)의 DB 접속 정보를 받아오는 바인딩.
# provider.kubernetes: AWS Secrets Manager가 아니라 클러스터 안의 petflow-db-app 시크릿을
# 네임스페이스만 넘어서 그대로 읽어오는 방식 — AWS 인증(Pod Identity) 불필요.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-db-reader
  namespace: order-service
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: cnpg-db-app
  namespace: order-service
spec:
  provider:
    kubernetes:
      remoteNamespace: database
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: eso-db-reader
          namespace: order-service
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-credentials
  namespace: order-service
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cnpg-db-app
    kind: SecretStore
  target:
    name: db-credentials
    creationPolicy: Owner
  data:
    - secretKey: SPRING_DATASOURCE_URL
      remoteRef:
        key: petflow-db-app
        property: jdbc-uri
    - secretKey: SPRING_DATASOURCE_USERNAME
      remoteRef:
        key: petflow-db-app
        property: username
    - secretKey: SPRING_DATASOURCE_PASSWORD
      remoteRef:
        key: petflow-db-app
        property: password
---
# internal.gateway-secret 임시값(2026-09-16). order-service가 장바구니 PR(#60)에서
# common-security 모듈 의존성이 추가되면서 auth/member-service와 같은
# PlaceholderResolutionException으로 크래시하게 됨 — 이미 만들어둔 공유 임시값을
# 그대로 재사용(petflow/internal/gateway-secret, auth/member-service와 동일).
# api-gateway 배포 시 실제 값으로 교체 예정.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gateway-secret
  namespace: order-service
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: gateway-secret
    creationPolicy: Owner
  data:
    - secretKey: INTERNAL_GATEWAY_SECRET
      remoteRef:
        key: petflow/internal/gateway-secret
---
# Kafka SASL 자격증명 + 브로커 신원 확인용 CA(2026-09-18). kafka-users.yaml(2단계)이
# kafka 네임스페이스에 만든 order-service Secret과 Kafka Cluster CA Secret을 그대로
# 가져온다. eso-db-reader ServiceAccount는 위에서 이미 만들어져 있어 재사용.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: kafka-secrets
  namespace: order-service
spec:
  provider:
    kubernetes:
      remoteNamespace: kafka
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: eso-db-reader
          namespace: order-service
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kafka-credentials
  namespace: order-service
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: kafka-secrets
    kind: SecretStore
  target:
    name: kafka-credentials
    creationPolicy: Owner
  data:
    - secretKey: SPRING_KAFKA_PROPERTIES_SASL_JAAS_CONFIG
      remoteRef:
        key: order-service
        property: sasl.jaas.config
    - secretKey: ca.crt
      remoteRef:
        key: pet-subscription-kafka-cluster-ca-cert
        property: ca.crt
