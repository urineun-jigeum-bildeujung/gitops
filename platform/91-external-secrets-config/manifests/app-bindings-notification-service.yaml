# notification-service가 CNPG(petflow-db, database 네임스페이스)의 DB 접속 정보를 받아오는 바인딩.
# provider.kubernetes로 CNPG가 생성한 petflow-db-app Secret을 서비스 네임스페이스에 복사한다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-db-reader
  namespace: notification-service
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: cnpg-db-app
  namespace: notification-service
spec:
  provider:
    kubernetes:
      remoteNamespace: database
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: eso-db-reader
          namespace: notification-service
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-credentials
  namespace: notification-service
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cnpg-db-app
    kind: SecretStore
  target:
    name: db-credentials
    creationPolicy: Owner
  data:
    - secretKey: SPRING_DATASOURCE_URL
      remoteRef:
        key: petflow-db-app
        property: jdbc-uri
    - secretKey: SPRING_DATASOURCE_USERNAME
      remoteRef:
        key: petflow-db-app
        property: username
    - secretKey: SPRING_DATASOURCE_PASSWORD
      remoteRef:
        key: petflow-db-app
        property: password
---
# Notification의 InternalFeignClientConfig가 사용하는 공유 Gateway secret.
# 다른 Backend/API Gateway와 동일한 AWS Secrets Manager 원본에서 공급한다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gateway-secret
  namespace: notification-service
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: gateway-secret
    creationPolicy: Owner
  data:
    - secretKey: INTERNAL_GATEWAY_SECRET
      remoteRef:
        key: petflow/internal/gateway-secret
