# kafka-users.yaml(2단계)에서 Strimzi User Operator가 만든 SASL 자격증명 Secret과
# Kafka Cluster CA 인증서 Secret은 kafka 네임스페이스에 있어서, ESO의 Kubernetes
# provider SecretStore가 네임스페이스 경계만 넘어 읽어올 수 있게 하는 RBAC.
#
# CNPG DB 크리덴셜 때(rbac-cnpg-db-app-secret.yaml)와 완전히 동일한 패턴이라 새
# ServiceAccount를 안 만들고 이미 order-service/product-service 네임스페이스에 있는
# eso-db-reader를 그대로 재사용한다. 권한은 이 3개 Secret으로만 최소 범위 고정.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-read-kafka-secret
  namespace: kafka
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - order-service
      - product-service
      - payment-service
      - pet-subscription-kafka-cluster-ca-cert
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-read-kafka-secret
  namespace: kafka
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eso-read-kafka-secret
subjects:
  - kind: ServiceAccount
    name: eso-db-reader
    namespace: order-service
  - kind: ServiceAccount
    name: eso-db-reader
    namespace: product-service
  - kind: ServiceAccount
    name: eso-db-reader
    namespace: payment-service
