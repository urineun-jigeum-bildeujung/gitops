# 하나의 AWS Secrets Manager JSON을 Redis와 세 클라이언트 네임스페이스에 바인딩한다.
# ACL 해시는 External Secrets가 생성하므로 Helm/Argo CD 렌더링에 비밀번호가 들어가지 않는다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: redis-auth
  namespace: redis
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: redis-auth
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        redis-password: "{{ .defaultPassword }}"
        users.conf: |
          user petflow-app on #{{ .appPassword | sha256sum }} ~* &* +@all
          user security-audit on #{{ .auditPassword | sha256sum }} ~* resetchannels -@all +ping +scan +type +ttl +pttl +exists
  data:
    - secretKey: defaultPassword
      remoteRef:
        key: petflow/redis/credentials
        property: default-password
    - secretKey: appPassword
      remoteRef:
        key: petflow/redis/credentials
        property: app-password
    - secretKey: auditPassword
      remoteRef:
        key: petflow/redis/credentials
        property: audit-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: redis-app-credentials
  namespace: auth-service
spec:
