# API Gateway와 Backend가 요청 인증에 사용하는 공유 값. 실제 값은 AWS Secrets Manager에
# 두고, Git에는 Secret 이름·키와 참조 경로만 관리한다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gateway-secret
  namespace: api-gateway
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: gateway-secret
    creationPolicy: Owner
  data:
    - secretKey: INTERNAL_GATEWAY_SECRET
      remoteRef:
        key: petflow/internal/gateway-secret
