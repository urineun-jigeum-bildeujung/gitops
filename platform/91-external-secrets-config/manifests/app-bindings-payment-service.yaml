# payment-service가 CNPG(petflow-db, database 네임스페이스)의 DB 접속 정보를 받아오는 바인딩.
# order-service/product-service와 동일 패턴 - 공용 app DB를 그대로 씀(서비스별 DB 분리 아님).
# sever #77(결제 API 구현) 머지로 payment-service가 실제 배포됐는데, 이 바인딩이 없어서
# SPRING_DATASOURCE_*/internal.gateway-secret을 못 찾아 부팅 크래시했음(2026-09-18).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-db-reader
  namespace: payment-service
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: cnpg-db-app
  namespace: payment-service
spec:
  provider:
    kubernetes:
      remoteNamespace: database
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: eso-db-reader
          namespace: payment-service
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-credentials
  namespace: payment-service
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cnpg-db-app
    kind: SecretStore
  target:
    name: db-credentials
    creationPolicy: Owner
  data:
    - secretKey: SPRING_DATASOURCE_URL
      remoteRef:
        key: petflow-db-app
        property: jdbc-uri
    - secretKey: SPRING_DATASOURCE_USERNAME
      remoteRef:
        key: petflow-db-app
        property: username
    - secretKey: SPRING_DATASOURCE_PASSWORD
      remoteRef:
        key: petflow-db-app
        property: password
---
# internal.gateway-secret 임시값 - order-service/auth-service/member-service와 동일한
# 공유 임시값 재사용(petflow/internal/gateway-secret). api-gateway 배포 시 실제 값으로 교체 예정.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gateway-secret
  namespace: payment-service
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: gateway-secret
    creationPolicy: Owner
  data:
    - secretKey: INTERNAL_GATEWAY_SECRET
      remoteRef:
        key: petflow/internal/gateway-secret
