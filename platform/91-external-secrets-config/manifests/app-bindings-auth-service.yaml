# auth-service가 CNPG(petflow-db, database 네임스페이스)의 DB 접속 정보를 받아오는 바인딩.
# provider.kubernetes: AWS Secrets Manager가 아니라 클러스터 안의 petflow-db-app 시크릿을
# 네임스페이스만 넘어서 그대로 읽어오는 방식 — AWS 인증(Pod Identity) 불필요.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-db-reader
  namespace: auth-service
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: cnpg-db-app
  namespace: auth-service
spec:
  provider:
    kubernetes:
      remoteNamespace: database
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: eso-db-reader
          namespace: auth-service
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-credentials
  namespace: auth-service
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cnpg-db-app
    kind: SecretStore
  target:
    name: db-credentials
    creationPolicy: Owner
  data:
    - secretKey: SPRING_DATASOURCE_URL
      remoteRef:
        key: petflow-db-app
        property: jdbc-uri
    - secretKey: SPRING_DATASOURCE_USERNAME
      remoteRef:
        key: petflow-db-app
        property: username
    - secretKey: SPRING_DATASOURCE_PASSWORD
      remoteRef:
        key: petflow-db-app
        property: password
---
# auth-service JWT(RS256) 서명키. api-gateway/member-service와 값을 맞춰야 하는
# internal.gateway-secret과 달리, 이 키는 auth-service 혼자만 쓰고 검증도 auth-service의
# 공개키(JWK)로 하므로 다른 서비스와 조율 없이 여기서 새로 생성해서 바로 씀.
# ClusterSecretStore(provider.aws, Pod Identity)를 쓰는 이유 — DB 크리덴셜과 달리
# CNPG가 만들어주는 값이 아니라 우리가 직접 생성한 값이라, 클러스터 안의 다른 Secret을
# 복사해오는 provider.kubernetes 방식이 아니라 AWS Secrets Manager에 원본을 두고
# 가져오는 provider.aws 방식을 쓴다(2026-09-15 EKS Pod Identity 연동 완료로 사용 가능해짐).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jwt-credentials
  namespace: auth-service
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: jwt-credentials
    creationPolicy: Owner
  data:
    - secretKey: JWT_RSA_PRIVATE_KEY
      remoteRef:
        key: petflow/auth-service/jwt-rsa-private-key
---
# internal.gateway-secret 임시값(2026-09-15). api-gateway가 아직 배포 전이라 실제 검증
# 대상이 없는 상태 — auth-service/member-service 부팅 실패(PlaceholderResolutionException)만
# 우선 해소하는 목적. auth-service/member-service/api-gateway가 전부 같은 값을 써야 하므로
# 서비스별 경로(petflow/auth-service/...)가 아니라 공유 경로(petflow/internal/...)에 둠.
# 백엔드팀이 실제 값/생성 규칙을 정하면 AWS Secrets Manager 값만 교체하면 되고,
# gitops/gitops-value 코드는 다시 건드릴 필요 없음(ExternalSecret refreshInterval 1h +
# rolling restart로 반영).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gateway-secret
  namespace: auth-service
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: gateway-secret
    creationPolicy: Owner
  data:
    - secretKey: INTERNAL_GATEWAY_SECRET
      remoteRef:
        key: petflow/internal/gateway-secret
