# Strimzi Kafka Operator 설치. 실제 Kafka 클러스터(브로커)는 이 오퍼레이터가 준비된 뒤
# platform/50-kafka-cluster/ 에서 별도 CR로 생성 (다른 오퍼레이터들과 동일한 "설치/설정 분리" 패턴).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kafka-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    chart: strimzi-kafka-operator
    repoURL: https://strimzi.io/charts/
    # 최신(1.2.0)은 Kafka 4.2.x/4.3.x만 지원 — 로컬 Kafka 3.9.0과 맞추기 위해
    # 3.9.0/3.9.1을 지원하는 마지막 버전인 0.45.2로 고정 (2026-09-08 확인).
    targetRevision: "0.45.2"
    helm:
      releaseName: strimzi-kafka-operator
      values: |
        watchNamespaces:
          - kafka
        resources: {}
  destination:
    server: https://kubernetes.default.svc
    namespace: kafka
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
