# Redis 서버용 mTLS 인증서. internal-ca-issuer(platform/00-internal-ca)를 그대로 재사용한다
# — Kafka(Strimzi가 자체 CA를 새로 만드는 구조)와 달리, Redis는 기존 내부 CA 체계에
# 그대로 편입시킨다. 클라이언트(order-service 등)는 이미 같은 CA로 발급받은 HTTP mTLS
# 인증서(generic-service 차트의 mtls.enabled)를 Redis 접속에도 그대로 재사용할 수 있어서
# 서버 인증서 하나만 여기서 새로 발급하면 된다.
#
# usages에 client auth도 넣는 이유(2026-09-18, 실제 CrashLoopBackOff로 발견):
# tls.authClients: true가 켜지면 Bitnami 헬스체크 스크립트(redis-cli --tls ping)도
# 자기 자신한테 "클라이언트"로 접속하면서 이 인증서를 그대로 제시한다 - server auth만
# 있으면 그 자체 접속 시도가 "certificate verify failed"로 거부되어 헬스체크가 계속
# 실패하고 kubelet이 SIGTERM으로 죽여서 CrashLoopBackOff에 빠짐. 애초에 "다른 서비스한테
# 클라이언트로 안 나간다"는 가정 자체가 로컬 헬스체크 케이스를 놓친 것.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: redis-server-mtls
  namespace: redis
spec:
  secretName: redis-server-mtls-cert
  commonName: redis-master.redis.svc.cluster.local
  dnsNames:
    - redis-master.redis.svc.cluster.local
    - redis-master.redis.svc
  duration: 2160h
  renewBefore: 360h
  privateKey:
    algorithm: ECDSA
    size: 256
  usages:
    - server auth
    - client auth
  issuerRef:
    name: internal-ca-issuer
    kind: ClusterIssuer
    group: cert-manager.io
