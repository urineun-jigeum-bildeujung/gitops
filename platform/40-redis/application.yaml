# 타임딜 동시성 락/카운터 용도로 사용하는 Redis.
# Kafka/Postgres와 달리 CRD 기반 오퍼레이터가 필요 없어서, Loki/Tempo와 동일하게
# Helm chart 하나로 바로 배포한다 (별도 인스턴스 CR 없음).
#
# architecture: standalone — 지금 규모(dev, 소규모 EKS 노드)에선 master+replica 구성이
# 오버스펙이라 단일 인스턴스로 시작. 나중에 HA 필요해지면 replication으로 전환.
# auth.enabled: false — 클러스터 내부에서만 접근하는 dev 환경이라 우선 비활성화.
#   외부 노출 경로가 생기거나 운영 전환 시 재검토 필요. mTLS(tls.authClients)로 신원을
#   확인하므로 비밀번호 인증까지 이중으로 걸 필요는 없다고 판단(2026-09-18).
#
# ⚠️ 주의: tls.enabled를 true로 바꾸면 기존 평문 6379 포트가 즉시 TLS 전용으로
#   바뀐다(Bitnami 차트가 REDIS_TLS_PORT를 기존 포트와 동일 값으로 씀 — Kafka처럼
#   새 포트를 열어 점진적으로 옮기는 방식이 아님). 그래서 이 값을 실제로 true로 바꿔
#   머지하는 시점엔 order-service/auth-service의 spring.data.redis.ssl.* env(gitops-value)도
#   같은 타이밍에 반영돼 있어야 한다 — 안 그러면 그 사이 장바구니/로그인 기능이 끊김.
#   (redis-server-mtls-cert 자체는 platform/39-redis-cert가 이미 발급해 둔 상태, 2026-09-18)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    chart: redis
    repoURL: https://charts.bitnami.com/bitnami
    # 최신(28.0.15)은 Redis 8.10.1 — 백엔드 local-infra(docker-compose)가 Redis 7을 쓰고 있어서
    # 메이저 버전을 맞추기 위해 Redis 7.x를 배포하는 20.13.4로 고정 (2026-09-09 확인).
    targetRevision: "20.13.4"
    helm:
      releaseName: redis
      values: |
        # Bitnami가 무료 저장소(docker.io/bitnami/*)에서 과거 버전 태그를 전부 내리고
        # bitnamilegacy/*로 옮겨서, 최신 아닌 버전(7.4.3)은 저장소를 명시해야 pull된다.
        image:
          repository: bitnamilegacy/redis
        # 차트 자체가 image.repository를 "표준(docker.io/bitnami/*)이 아니면" helm template
        # 렌더링을 에러로 막는 검증 로직을 내장하고 있어서(NOTES.txt), 이 옵션 없이는
        # ArgoCD가 매니페스트 생성 자체에 실패해 ComparisonError로 멈춘다. 의도적으로
        # legacy 저장소를 쓴다는 걸 차트에 알려주는 옵션.
        global:
          security:
            allowInsecureImages: true
        architecture: standalone
        # 기본 allow-all-client 정책과 새 정책의 합집합이 생기지 않도록 교체한다.
        networkPolicy:
          enabled: false
        extraDeploy:
          - apiVersion: "networking.k8s.io/v1"
            kind: "NetworkPolicy"
            metadata:
              name: "redis-clients-ingress"
              namespace: "redis"
            spec:
              podSelector:
                matchLabels:
                  app.kubernetes.io/name: "redis"
                  app.kubernetes.io/instance: "redis"
              policyTypes:
                - "Ingress"
              ingress:
                - from:
                    - namespaceSelector:
                        matchLabels:
                          kubernetes.io/metadata.name: "auth-service"
                      podSelector:
                        matchLabels:
                          app.kubernetes.io/name: "generic-service"
                          app.kubernetes.io/instance: "dev-auth-service"
                    - namespaceSelector:
                        matchLabels:
                          kubernetes.io/metadata.name: "order-service"
                      podSelector:
                        matchLabels:
                          app.kubernetes.io/name: "generic-service"
                          app.kubernetes.io/instance: "dev-order-service"
                    - namespaceSelector:
                        matchLabels:
                          kubernetes.io/metadata.name: "api-gateway"
                      podSelector:
                        matchLabels:
                          app.kubernetes.io/name: "generic-service"
                          app.kubernetes.io/instance: "dev-api-gateway"
                  ports:
                    - protocol: "TCP"
                      port: 6379
                - from:
                    - namespaceSelector:
                        matchLabels:
                          kubernetes.io/metadata.name: "redis"
                      podSelector:
                        matchLabels:
                          app.kubernetes.io/name: "redis"
                          app.kubernetes.io/instance: "redis"
                  ports:
                    - protocol: "TCP"
                      port: 6379
        auth:
          enabled: false
        # internal-ca-issuer로 발급한 서버 인증서(platform/39-redis-cert)를 그대로 연결.
        # authClients 기본값이 true라 별도로 안 적어도 mTLS로 동작하지만, 의도를 명확히
        # 남기려고 명시적으로 적어둔다. cert-manager Secret의 키 이름(tls.crt/tls.key/ca.crt)을
        # certFilename 계열에 그대로 매핑하면 된다.
        tls:
          enabled: true
          authClients: true
          existingSecret: redis-server-mtls-cert
          certFilename: tls.crt
          certKeyFilename: tls.key
          certCAFilename: ca.crt
        # 타임딜 Queue/구매 제어 후보까지 고려해 DEV에서도 재시작 후 데이터 복구가
        # 가능하도록 AOF + gp3 PVC를 사용한다. HA/replica는 현재 범위가 아니다.
        commonConfiguration: |-
          appendonly yes
          save ""
        master:
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          persistence:
            enabled: true
            storageClass: gp3
            accessModes:
              - ReadWriteOnce
            size: 8Gi
          service:
            type: ClusterIP
            ports:
              redis: 6379
  destination:
    server: https://kubernetes.default.svc
    namespace: redis
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
