# 선행 배포되는 cert-manager(sync-wave -10)가 뜬 뒤, 그 위에 내부 서비스 간 mTLS용
# 사설 CA(ClusterIssuer)를 구성한다. 7개 백엔드 서비스의 Certificate 리소스가
# 이 internal-ca-issuer를 참조하게 될 예정.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: internal-ca
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-9"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://github.com/urineun-jigeum-bildeujung/gitops.git
    targetRevision: main
    path: platform/00-internal-ca/manifests
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
