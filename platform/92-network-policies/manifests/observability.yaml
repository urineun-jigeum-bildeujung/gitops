# 관측성의 알려진 수신 Pod만 제한한다. Operator와 플랫폼 Egress는 그대로 유지한다.
# 포트는 Service port가 아니라 목적지 Pod의 실제 targetPort이다.
apiVersion: "networking.k8s.io/v1"
kind: "NetworkPolicy"
metadata:
  name: "tempo-ingress"
  namespace: "observability"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: "tempo"
      app.kubernetes.io/instance: "tempo"
  policyTypes:
    - "Ingress"
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "auth-service"
          podSelector:
            matchLabels:
              app.kubernetes.io/name: "generic-service"
              app.kubernetes.io/instance: "dev-auth-service"
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "member-service"
          podSelector:
            matchLabels:
              app.kubernetes.io/name: "generic-service"
              app.kubernetes.io/instance: "dev-member-service"
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "product-service"
          podSelector:
            matchLabels:
              app.kubernetes.io/name: "generic-service"
              app.kubernetes.io/instance: "dev-product-service"
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "order-service"
          podSelector:
            matchLabels:
              app.kubernetes.io/name: "generic-service"
              app.kubernetes.io/instance: "dev-order-service"
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "payment-service"
          podSelector:
            matchLabels:
              app.kubernetes.io/name: "generic-service"
              app.kubernetes.io/instance: "dev-payment-service"
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "review-service"
          podSelector:
            matchLabels:
              app.kubernetes.io/name: "generic-service"
              app.kubernetes.io/instance: "dev-review-service"
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "notification-service"
          podSelector:
            matchLabels:
              app.kubernetes.io/name: "generic-service"
              app.kubernetes.io/instance: "dev-notification-service"
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "api-gateway"
          podSelector:
            matchLabels:
              app.kubernetes.io/name: "generic-service"
              app.kubernetes.io/instance: "dev-api-gateway"
      ports:
        - protocol: "TCP"
          port: 4318
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "observability"
          podSelector:
            matchLabels:
              app.kubernetes.io/name: "alloy"
              app.kubernetes.io/instance: "alloy"
      ports:
        - protocol: "TCP"
          port: 4317
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "observability"
          podSelector:
            matchLabels:
              app.kubernetes.io/name: "grafana"
              app.kubernetes.io/instance: "kube-prometheus-stack"
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "observability"
          podSelector:
            matchLabels:
              app.kubernetes.io/name: "prometheus"
              app.kubernetes.io/instance: "kube-prometheus-stack-prometheus"
      ports:
        - protocol: "TCP"
          port: 3200
---
