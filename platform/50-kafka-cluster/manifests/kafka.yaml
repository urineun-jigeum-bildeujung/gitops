# KRaft 모드 단일 노드 Kafka 클러스터 — 로컬 개발 환경과 버전(3.9.0)·모드(KRaft)를 맞춤.
#
# 지금은 데모/뼈대 단계라 controller+broker 역할을 겸하는 노드 1개로 최소 구성.
# 실제 운영 규모가 커지면 replicas를 늘리고 controller/broker 역할도 분리 검토.
#
# KafkaTopic은 topic.yaml에서 관리한다. Kubernetes metadata.name은 lowercase DNS 이름을,
# 실제 Kafka Topic은 spec.topicName의 Backend 이벤트 이름을 사용한다.
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: dual-role
  namespace: kafka
  labels:
    strimzi.io/cluster: pet-subscription-kafka
spec:
  replicas: 1
  roles:
    - controller
    - broker
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 10Gi
        class: gp3
        deleteClaim: false
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
---
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: pet-subscription-kafka
  namespace: kafka
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: 3.9.0 # local-infra/docker-compose.yml과 동일 버전 유지
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
  entityOperator:
    topicOperator: {}
    userOperator: {}
