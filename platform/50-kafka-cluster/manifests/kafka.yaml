# KRaft 모드 단일 노드 Kafka 클러스터 — 로컬 개발 환경과 버전(3.9.0)·모드(KRaft)를 맞춤.
#
# 지금은 데모/뼈대 단계라 controller+broker 역할을 겸하는 노드 1개로 최소 구성.
# 실제 운영 규모가 커지면 replicas를 늘리고 controller/broker 역할도 분리 검토.
#
# 토픽(KafkaTopic)은 서비스 목록/이벤트 이름이 아직 초안이라 여기 포함하지 않음 —
# 확정되면 이 폴더에 topics.yaml로 추가 예정 (entityOperator.topicOperator가 이미 켜져있어
# KafkaTopic CR만 추가하면 바로 반영됨).
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: dual-role
  labels:
    strimzi.io/cluster: pet-subscription-kafka
spec:
  replicas: 1
  roles:
    - controller
    - broker
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 10Gi
        deleteClaim: false
---
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: pet-subscription-kafka
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: 3.9.0 # local-infra/docker-compose.yml과 동일 버전 유지
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
  entityOperator:
    topicOperator: {}
    userOperator: {}
