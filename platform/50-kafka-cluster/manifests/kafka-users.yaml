# Kafka 서비스 간 통신 인증(SASL/SCRAM-SHA-512, 2026-09-18). 실제로 Kafka를 쓰는
# order-service/product-service 2개 서비스에만 KafkaUser를 발급한다(sever 코드로 직접
# 확인 - 나머지 서비스는 아직 Kafka 코드 자체가 없음).
#
# 이 CR을 적용하면 Strimzi User Operator(kafka.yaml의 entityOperator.userOperator로
# 이미 켜져 있음)가:
#   1) 랜덤 비밀번호를 생성해서 브로커 내부 SCRAM 자격증명 저장소에 등록하고
#   2) 이 CR과 같은 이름(order-service/product-service)의 Secret을 kafka 네임스페이스에
#      만든다. 그 안에 완성된 sasl.jaas.config 문자열까지 들어있어서 클라이언트가 직접
#      조립할 필요가 없다.
#
# 이 Secret은 kafka 네임스페이스에 생기므로(User Operator가 이 네임스페이스만 감시),
# order-service/product-service 네임스페이스로 그대로 못 가져간다 - 3단계에서
# ExternalSecret으로 네임스페이스 경계를 넘겨야 실제로 쓸 수 있다.
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaUser
metadata:
  name: order-service
  namespace: kafka
  labels:
    strimzi.io/cluster: pet-subscription-kafka
spec:
  authentication:
    type: scram-sha-512
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaUser
metadata:
  name: product-service
  namespace: kafka
  labels:
    strimzi.io/cluster: pet-subscription-kafka
spec:
  authentication:
    type: scram-sha-512
