apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karpenter
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    # 1.13.0 OCI manifest digest 확인값:
    # sha256:58f71ed9635a4641bf5d09517ff276c6712eb7b59795ce93a4c321a9fcc3bbf5
    repoURL: public.ecr.aws/karpenter
    chart: karpenter
    targetRevision: "1.13.0"
    helm:
      releaseName: karpenter
      values: |
        replicas: 2
        serviceAccount:
          create: true
          name: karpenter
        settings:
          clusterName: petflow-eks
          eksControlPlane: true
        controller:
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 1
              memory: 1Gi
        # Karpenter 자체는 Karpenter가 만든 노드에 의존하지 않도록 MNG에 고정한다.
        nodeSelector:
          eks.amazonaws.com/nodegroup: petflow-node-group
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
