# CI 서버(Jenkins) — Kafka/Redis와 동일하게 Helm chart로 클러스터 안에 직접 배포한다.
# 이 chart는 Kubernetes plugin이 기본 내장되어 있어서, 빌드마다 동적으로 agent Pod을
# 띄우는 방식이 자연스럽다 (sever/Jenkinsfile의 agent 블록도 이에 맞춰 작성 예정).
#
# controller.installPlugins — sever CI 파이프라인에 필요한 최소 플러그인만 우선 지정.
#   workflow-aggregator/git   : Declarative Pipeline 기본
#   pipeline-utility-steps    : readJSON (detect-services.sh 결과 파싱용)
#   kubernetes                : 동적 agent Pod 생성
#   configuration-as-code     : 차트 기본 목록엔 있는데, installPlugins를 통째로 덮어쓰면서
#                               빠졌던 것 — 이게 없으면 차트가 만들어주는 JCasC(Kubernetes Cloud
#                               설정 포함)를 Jenkins가 읽어서 적용하질 못해서 "No Kubernetes
#                               cloud was found" 에러가 남 (2026-09-10 실제로 겪음)
# 도커 이미지 빌드(K8s 안에서 docker build)는 별도 설계 필요 — Pod 안에 도커 데몬이
# 없어서 kaniko/buildkit 등을 붙여야 함. 이번 범위에서는 Jenkins 서버 자체만 올린다.
#
# persistence — Jenkins는 상태(Job 설정, 빌드 이력, 플러그인)를 갖는 stateful 워크로드라
# Redis(지금은 auth 끈 캐시 용도)와 달리 PVC가 필수.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jenkins
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  sources:
    - chart: jenkins
      repoURL: https://charts.jenkins.io
      targetRevision: "5.9.56" # 2026-09-09 기준 최신 안정 버전 (appVersion 2.568.3)
      helm:
        releaseName: jenkins
        values: |
          controller:
            installPlugins:
              - workflow-aggregator
              - git
              - pipeline-utility-steps
              - kubernetes
              - configuration-as-code
            resources: {}
            # admin 계정 Secret을 차트가 직접 만들게 두면(기본값, existingSecret 미지정) ArgoCD가
            # helm template을 오프라인 렌더링하는 특성상 lookup 함수가 항상 "없음"으로 평가돼서
            # 매 sync마다 비번이 새 랜덤값으로 바뀜 — 실제 Jenkins는 마지막 pod 부팅 시점 비번을
            # 그대로 쓰고 있어서 시크릿 조회값과 실제 로그인값이 어긋나는 사고로 이어짐(2026-09-11
            # 실제로 겪음). existingSecret만 지정하면 secret.yaml 템플릿(자체 Secret 생성)은
            # 자동으로 스킵되므로 createSecret은 반드시 true(기본값) 유지 — false로 두면
            # admin 계정용 Secret 볼륨 마운트 로직 자체가 통째로 빠져서 Jenkins 부팅이 실패한다
            # (StatefulSet 템플릿에서 createSecret이 그 마운트 블록 전체의 게이트라서, 2026-09-11
            # helm template로 직접 렌더링해서 실제로 확인함). gitops Taskfile의
            # bootstrap:jenkins-admin-secret이 별도로 관리하는 Secret을 이 이름으로 참조한다.
            admin:
              createSecret: true
              existingSecret: jenkins-admin-credentials
          persistence:
            enabled: true
            size: 8Gi
          agent:
            enabled: true
    # kaniko 빌드 Pod 전용 ServiceAccount — infra팀의 EKS Pod Identity association과
    # 고정 계약(jenkins/jenkins-kaniko, infra 레포 docs/jenkins-kaniko-ecr.md 참고)이라
    # 이 매니페스트는 chart 소스와 별도로 둔다.
    - repoURL: https://github.com/urineun-jigeum-bildeujung/gitops.git
      targetRevision: main
      path: platform/40-jenkins/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: jenkins
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
