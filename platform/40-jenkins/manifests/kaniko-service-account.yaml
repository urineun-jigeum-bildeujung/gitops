# Kaniko 빌드 Pod 전용 ServiceAccount.
# 이름(jenkins-kaniko)과 네임스페이스(jenkins)는 infra팀이 만든 EKS Pod Identity
# association과 고정된 계약이다 — 바꾸면 ECR push 권한이 끊긴다
# (infra 레포 docs/jenkins-kaniko-ecr.md 참고). Pod Identity라서 별도 어노테이션은 불필요.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins-kaniko
  namespace: jenkins
