# _repurchase는 ApplicationSet에서 제외되므로 수동 Job의 계정을 platform이 준비한다.
# generic-service Helm value의 serviceAccount.create=false로 중복 관리를 피한다.
# EKS Pod Identity 연결은 infra의 platform-iam 모듈이 관리한다 (IRSA annotation 없음).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: generic-service
  namespace: repurchase
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
