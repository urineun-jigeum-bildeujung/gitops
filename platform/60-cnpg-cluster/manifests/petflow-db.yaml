# CNPG Cluster/ObjectStore는 infra/tapply.sh가 복원 여부와 세대별 WAL 경로를 결정해 생성한다.
# GitOps는 DB와 일일 Backup 정책을 관리한다.
# sever/local-infra/postgres/init.sql 및 각 서비스 application 설정과 같은 DB 경계다.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: auth-db
  namespace: database
spec:
  name: auth_db
  owner: app
  cluster:
    name: petflow-db
  databaseReclaimPolicy: retain
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: member-db
  namespace: database
spec:
  name: member_db
  owner: app
  cluster:
    name: petflow-db
  databaseReclaimPolicy: retain
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: product-db
  namespace: database
spec:
  name: product_db
  owner: app
  cluster:
    name: petflow-db
  databaseReclaimPolicy: retain
  extensions:
    - name: pg_bigm
    - name: vector
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: order-db
  namespace: database
spec:
  name: order_db
  owner: app
  cluster:
    name: petflow-db
  databaseReclaimPolicy: retain
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: payment-db
  namespace: database
spec:
  name: payment_db
  owner: app
  cluster:
    name: petflow-db
  databaseReclaimPolicy: retain
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: review-db
  namespace: database
spec:
  name: review_db
  owner: app
  cluster:
    name: petflow-db
  databaseReclaimPolicy: retain
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: notification-db
  namespace: database
spec:
  name: notification_db
  owner: app
  cluster:
    name: petflow-db
  databaseReclaimPolicy: retain
---
# 매일 03:00 KST (18:00 UTC)에 base backup을 생성한다.
# CNPG ScheduledBackup cron은 초를 포함하는 6-field 형식이다.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: petflow-db-daily
  namespace: database
spec:
  schedule: "0 0 18 * * *"
  backupOwnerReference: self
  cluster:
    name: petflow-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
