# DEV PostgreSQL HA cluster. CNPG가 instance별 data PVC를 자동 생성·관리한다.
# Terraform의 cnpg_namespace/service_account_name/cnpg_backup_prefix와 이름을 함께 변경해야 한다.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: petflow-db-backups
  namespace: database
spec:
  configuration:
    destinationPath: s3://petflow-dev-db-backups/cnpg
    s3Credentials:
      # EKS Pod Identity가 제공하는 AWS SDK 기본 자격 증명 체인을 사용한다.
      inheritFromIAMRole: true
    wal:
      compression: gzip
  retentionPolicy: "30d"
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: petflow-db
  namespace: database
spec:
  instances: 2
  imageName: 297165773875.dkr.ecr.ap-northeast-2.amazonaws.com/petflow/postgresql-pg-bigm:17.11-pg-bigm-1.2-20250903

  postgresql:
    shared_preload_libraries:
      - pg_bigm

  # 하나의 PostgreSQL Cluster 안에서 서비스별 Database를 논리적으로 분리한다.
  # CNPG가 생성하는 application owner를 Database CR의 공통 owner로 사용한다.
  bootstrap:
    initdb:
      database: app
      owner: app

  # Primary/Standby를 서로 다른 AZ에 강제로 배치한다.
  affinity:
    enablePodAntiAffinity: true
    topologyKey: topology.kubernetes.io/zone
    podAntiAffinityType: required

  # CNPG가 petflow-db-1, petflow-db-2 data PVC를 생성한다.
  # 기존 gp3 PVC는 그대로 유지되고 새 인스턴스/재구축 PVC부터 gp3-cnpg를 사용한다.
  storage:
    storageClass: gp3-cnpg
    size: 20Gi

  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 2Gi

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: petflow-db-backups
        # initdb로 재생성할 때마다 새 PostgreSQL systemID로 변경한다.
        # 이전 DB의 WAL/base backup과 같은 archive를 공유하지 않는다.
        serverName: petflow-db-7686679137262796820
---
# sever/local-infra/postgres/init.sql 및 각 서비스 application 설정과 같은 DB 경계다.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: auth-db
  namespace: database
spec:
  name: auth_db
  owner: app
  cluster:
    name: petflow-db
  databaseReclaimPolicy: retain
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: member-db
  namespace: database
spec:
  name: member_db
  owner: app
  cluster:
    name: petflow-db
  databaseReclaimPolicy: retain
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: product-db
  namespace: database
spec:
  name: product_db
  owner: app
  cluster:
    name: petflow-db
  databaseReclaimPolicy: retain
  extensions:
    - name: pg_bigm
    - name: vector
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: order-db
  namespace: database
spec:
  name: order_db
  owner: app
  cluster:
    name: petflow-db
  databaseReclaimPolicy: retain
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: payment-db
  namespace: database
spec:
  name: payment_db
  owner: app
  cluster:
    name: petflow-db
  databaseReclaimPolicy: retain
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: review-db
  namespace: database
spec:
  name: review_db
  owner: app
  cluster:
    name: petflow-db
  databaseReclaimPolicy: retain
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: notification-db
  namespace: database
spec:
  name: notification_db
  owner: app
  cluster:
    name: petflow-db
  databaseReclaimPolicy: retain
---
# 매일 03:00 KST (18:00 UTC)에 base backup을 생성한다.
# CNPG ScheduledBackup cron은 초를 포함하는 6-field 형식이다.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: petflow-db-daily
  namespace: database
spec:
  schedule: "0 0 18 * * *"
  backupOwnerReference: self
  cluster:
    name: petflow-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
