apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: repurchase-default-deny
  namespace: repurchase
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: repurchase-db-egress
  namespace: repurchase
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: generic-service
      app.kubernetes.io/instance: dev-repurchase
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: database
          podSelector:
            matchLabels:
              cnpg.io/cluster: petflow-db
              cnpg.io/instanceRole: primary
      ports:
        - protocol: TCP
          port: 5432
