# Cluster/ObjectStore는 infra/tapply.sh가 복원 경로를 결정해 먼저 생성한다.
# 서비스별 Database, ScheduledBackup, NetworkPolicy 및 재구매 수동 실행 준비를 관리한다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: petflow-db
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://github.com/urineun-jigeum-bildeujung/gitops.git
    targetRevision: main
    path: platform/60-cnpg-cluster/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: database
  # GitOps는 미존재 Job을 suspend=true로 생성하되 수동 실행/중지를 되돌리지 않는다.
  ignoreDifferences:
    - group: batch
      kind: Job
      name: repurchase-shadow-run
      namespace: repurchase
      jsonPointers:
        - /spec/suspend
  syncPolicy:
    automated:
      # 기존 배포의 Cluster/ObjectStore가 이 Application의 추적 대상이었다.
      # 관리 이관 중 해당 리소스가 삭제되지 않도록 자동 prune을 끈다.
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
