# Cluster/ObjectStore는 infra/tapply.sh가 복원 경로를 결정해 먼저 생성한다.
# 이 Application은 서비스별 Database, ScheduledBackup, NetworkPolicy를 관리한다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: petflow-db
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://github.com/urineun-jigeum-bildeujung/gitops.git
    targetRevision: main
    path: platform/60-cnpg-cluster/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: database
  syncPolicy:
    automated:
      # 기존 배포의 Cluster/ObjectStore가 이 Application의 추적 대상이었다.
      # 관리 이관 중 해당 리소스가 삭제되지 않도록 자동 prune을 끈다.
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
