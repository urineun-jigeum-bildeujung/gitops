apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  sources:
    - chart: loki
      repoURL: https://grafana.github.io/helm-charts
      targetRevision: "7.3.0" # 2026-09-08 기준 최신 안정 버전
      helm:
        releaseName: loki
        values: |
          # 차트 기본값(deploymentMode: SimpleScalable)은 S3 등 오브젝트 스토리지가
          # 필수라서 loki.storage.bucketNames.chunks 없이는 템플릿 렌더링 자체가 실패함
          # (2026-09-13 클러스터 재기동 후 처음 sync하다가 발견 — 이 값이 원래부터
          # "resources: {}"만 있던 빈 설정이라 한 번도 제대로 뜬 적이 없었던 것으로 보임).
          # DEV는 로그 볼륨이 작아서 SingleBinary + 로컬 디스크(filesystem) 조합으로 충분함.
          deploymentMode: SingleBinary
          loki:
            auth_enabled: false
            commonConfig:
              replication_factor: 1
            storage:
              type: filesystem
            # 실제 운영급 schema_config을 손으로 안 짜도, useTestSchema가 위 storage.type에
            # 맞는 스키마(TSDB + filesystem)를 자동으로 채워줌 — 차트 자체가 "테스트/DEV용"이라고
            # 명시한 옵션이라 우리 용도에 정확히 맞음.
            useTestSchema: true
            # 프론트엔드 알림 2종(FrontendJsErrorSpike, FrontendOrderApiFailureSustained)이
            # Faro 로그(LogQL) 기반이라 Prometheus로는 못 만들어서 Loki 자체 Ruler를 씀.
            # SingleBinary 모드는 별도 ruler 파드 없이 이 설정 그대로 singleBinary 파드
            # 안에서 -target=all로 돈다. storage.local.directory는 아래 singleBinary.
            # extraVolumeMounts가 마운트하는 경로와 반드시 일치해야 한다.
            rulerConfig:
              alertmanager_url: http://kube-prometheus-stack-alertmanager.observability.svc.cluster.local:9093
              enable_api: true
              storage:
                type: local
                local:
                  directory: /etc/loki/rules
          singleBinary:
            replicas: 1
            # platform/30-loki/manifests/frontend-alert-rules.yaml(ConfigMap)을 Ruler가
            # 읽는 위치에 마운트. auth_enabled: false라 내부적으로 전부 "fake" 테넌트로
            # 처리되므로, ConfigMap의 items[].path로 <directory>/fake/ 서브디렉토리
            # 구조를 만들어줘야 Ruler가 이 룰 파일을 찾는다.
            extraVolumes:
              - name: frontend-alert-rules
                configMap:
                  name: loki-frontend-alert-rules
                  items:
                    - key: frontend-alerts.yaml
                      path: fake/frontend-alerts.yaml
            extraVolumeMounts:
              - name: frontend-alert-rules
                mountPath: /etc/loki/rules
          # 차트가 deploymentMode와 무관하게 read/write/backend(SimpleScalable용) 기본
          # replicas를 1로 잡아둬서, SingleBinary와 동시에 켜진 것으로 인식돼 검증 단계에서
          # 막힘("more than zero replicas configured for both ...") — 명시적으로 0으로 꺼야 함.
          write:
            replicas: 0
          read:
            replicas: 0
          backend:
            replicas: 0
          # memcached 기반 캐시(chunks/results)는 기본 활성화라 파드가 2개 더 뜨는데, DEV
          # 노드 자원이 넉넉하지 않고(m7i-flex.large 3대) 로그량도 적어 캐시 이득이 크지
          # 않으므로 꺼서 자원을 아낌.
          chunksCache:
            enabled: false
          resultsCache:
            enabled: false
    # kube-prometheus-stack의 alert-rules.yaml과 같은 패턴 — Ruler가 읽는 alert 규칙
    # ConfigMap은 Helm values로 넣기엔 너무 커서 별도 소스로 분리.
    - repoURL: https://github.com/urineun-jigeum-bildeujung/gitops.git
      targetRevision: main
      path: platform/30-loki/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
