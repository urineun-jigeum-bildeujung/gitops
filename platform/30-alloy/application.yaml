apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    chart: k8s-monitoring
    repoURL: https://grafana.github.io/helm-charts
    targetRevision: "4.5.2" # 2026-09-15 기준 최신 안정 버전
    helm:
      releaseName: alloy
      values: |
        # Loki/Tempo는 떠 있기만 하고 실제 로그·트레이스가 하나도 안 들어가고 있었음
        # (2026-09-15 확인 — loki에 있는 유일한 라벨이 loki-canary 자체 헬스체크 로그뿐,
        # tempo는 tagNames가 완전히 빈 상태). Alloy(Promtail 후속, 공식 유지 중인 수집기)를
        # DaemonSet으로 배포해서 각 노드의 파드 로그를 실제로 Loki로 보낸다.
        #
        # 서버 간 트레이스는 각 서비스가 OTLP로 tempo.observability:4317에 직접 보내서
        # Alloy를 안 거친다. 여기 tempo 목적지는 그것과 무관하게, 아래 faro.receiver가
        # 받은 브라우저 트레이스를 Tempo로 보내기 위한 것이다(2026-09-17, Grafana Faro
        # RUM 수집 1단계).
        cluster:
          name: petflow-dev
        collectors:
          alloy:
            presets: [filesystem-log-reader]
            # Faro Web SDK가 보내는 브라우저 텔레메트리(에러/성능/트레이스)를 받는 입구.
            # api_key는 아직 실제 시크릿이 없어서 비어있는 채로 시작 — 2단계(AWS Secrets
            # Manager + ExternalSecret `faro-collector`)에서 실제 값을 채워 넣을 예정.
            # 이 값이 비어있는 동안은 인증 없이 열려있는 상태이므로, 3단계(공개 노출)
            # 전까지는 클러스터 내부에서만 접근 가능해 실질적 위험은 없다.
            extraConfig: |
              faro.receiver "app" {
                server {
                  // listen_address 기본값이 127.0.0.1이라 파드 루프백에서만 접속 가능했음 —
                  // kubectl port-forward는 루프백을 타서 정상 응답했지만, 실제 Service/ALB를
                  // 통한 파드 간 통신은 전부 "Connection refused"로 막혀있었음(3단계 실제
                  // 배포 후 발견, 2026-09-17). 0.0.0.0으로 바꿔서 파드 밖에서도 접속 가능하게 함.
                  listen_address       = "0.0.0.0"
                  listen_port          = 12347
                  cors_allowed_origins = []
                  api_key              = env("FARO_API_KEY")
                }
                output {
                  logs   = [loki.process.faro_redact.receiver]
                  traces = [otelcol.processor.attributes.faro_redact.input]
                }
              }

              // 민감정보 2차 방어선(2026-09-21, 프론트엔드 지호님 요청 기반). 1차는
              // 프론트가 Faro SDK의 beforeSend/ignoreUrls로 원본에서 걸러내는 것이고,
              // 여기는 그게 빠졌을 경우를 대비한 백업 필터. 아직 Faro SDK가 실제로
              // 붙기 전이라 로그 줄의 정확한 JSON 구조를 검증 못 했음 — 그래서 특정
              // 키 아래 중첩된 값만 잡는 대신, 어디에 있든 값 패턴 자체를 정규식으로
              // 잡는 방식으로 짬(구조를 몰라도 비교적 안전하게 동작). 실제 트래픽이
              // 흐르기 시작하면 로그 샘플로 이 규칙들이 실제로 매칭되는지 재검증 필요.
              loki.process "faro_redact" {
                forward_to = [loki.write.loki.receiver]

                // 인가코드/결제키 등은 URL 자체에 실리므로 필드명 마스킹으로는 못 잡음 —
                // 4개 경로는 쿼리스트링을 통째로 제거한다.
                stage.replace {
                  expression = "(/(?:auth/callback|payment/done|signup|mypage/address/search))\\?[^\"'\\s]*"
                  replace    = "${1}?[REDACTED]"
                }

                // 인증/결제 관련 헤더 3종.
                stage.replace {
                  expression = "(?i)(\"(?:authorization|idempotency-key|x-api-key)\"\\s*:\\s*\")[^\"]*(\")"
                  replace    = "${1}[REDACTED]${2}"
                }

                // 인증/결제/배송지/회원 관련 본문 필드명. 정확히 일치가 아니라 포함(contains)
                // 매칭으로 짠다 — 프론트가 localStorage에 refreshToken을 "gollaju.refreshToken"
                // 키로 저장 중이라, 키 이름이 정확히 "refreshToken"일 때만 잡는 정규식으로는
                // 이 값이 에러 컨텍스트에 실려도 못 잡음(2026-09-21, 지호님 지적으로 발견).
                // "code"는 이름이 흔해서 무관한 값까지 가릴 수 있지만, 과잉 마스킹이 유출보다
                // 안전한 실패 방향이라 유지 — contains 매칭으로 바꾸면서 이 트레이드오프는 더 커짐.
                stage.replace {
                  expression = "(\"[^\"]*(?:accessToken|refreshToken|code|paymentKey|customerKey|tossOrderId|receiver|phone|address|detail|zipCode|deliveryNote|nickname)[^\"]*\"\\s*:\\s*\")[^\"]*(\")"
                  replace    = "${1}[REDACTED]${2}"
                }
              }

              // 트레이스(Tempo)는 헤더가 span 속성으로 들어올 경우만 우선 방어한다.
              // URL 쿼리스트링 제거는 Faro가 URL을 정확히 어느 속성 이름으로 실어보내는지
              // (http.url/url.full 등 구현마다 다름) 실트래픽으로 확인 전이라 보류함 —
              // 확인되는 대로 별도 처리 추가 필요.
              otelcol.processor.attributes "faro_redact" {
                action {
                  key    = "authorization"
                  action = "delete"
                }
                action {
                  key    = "idempotency-key"
                  action = "delete"
                }
                action {
                  key    = "x-api-key"
                  action = "delete"
                }
                action {
                  key    = "http.request.header.authorization"
                  action = "delete"
                }

                output {
                  traces = [otelcol.exporter.otlp.tempo.input]
                }
              }
            alloy:
              extraPorts:
                - name: faro
                  port: 12347
                  targetPort: 12347
                  protocol: TCP
              extraEnv:
                - name: FARO_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: faro-collector
                      key: FARO_API_KEY
        destinations:
          loki:
            type: loki
            url: http://loki-gateway.observability.svc.cluster.local/loki/api/v1/push
          tempo:
            type: otlp
            url: http://tempo.observability.svc.cluster.local:4317
            protocol: grpc
            # destinations.<name>.tls.insecure 기본값이 false(TLS 사용)라서 이 값 없이는
            # otelcol.exporter.otlp가 TLS 핸드셰이크를 시도하다 실패함(Tempo는 평문 gRPC).
            tls:
              insecure: true
        # 차트 자체 사용현황 메트릭(build_info 등, 우리 관측성 데이터와 무관)을 명시적으로
        # 안 끄면 "메트릭을 받을 수 있는 모든 목적지"로 자동 전송됨 — 우리 클러스터엔 그 조건에
        # 맞는 목적지가 tempo뿐이라 거기로 새고 있었음. Tempo는 트레이스 전용이라 메트릭을
        # 받는 기능이 없어 "Unimplemented ...MetricsService" 에러로 실패함. destinations.tempo에
        # metrics.enabled:false를 직접 주면 이 차트 버전(4.5.2) 특성상 그 목적지 자체가 통째로
        # 안 만들어지는 부작용이 있어(helm template로 확인), 그 대신 selfReporting 자체를 끔.
        selfReporting:
          enabled: false
        podLogsViaLoki:
          enabled: true
          destinations: ["loki"]
        # Faro 수집 엔드포인트 공개 노출 (2026-09-17, Faro RUM 수집 3단계).
        # web의 기존 Ingress(leechs.shop, ALB 그룹 petflow-public)와 같은 ALB를 공유하되
        # 경로만 다르게 추가 — ALB는 경로 재작성을 지원하지 않아서 Alloy가 실제로 받는
        # 경로(/collect)를 그대로 공개 경로로 씀(포트포워드로 실제 응답 확인 완료:
        # GET / -> 404, GET /-/ready -> 200, POST /collect(키 없이) -> 401).
        # group.order를 web(20)보다 낮게(10) 줘서, web의 만능 규칙(path: /)보다 먼저
        # 평가되게 함 — 안 그러면 /collect 요청도 web의 catch-all에 걸릴 수 있음.
        # leechs.shop 도메인은 나중에 바뀔 수 있음(placeholder 추적 메모에 기록해둠) —
        # 바뀌면 이 host 값도 같이 수정 필요.
        extraObjects:
          - apiVersion: networking.k8s.io/v1
            kind: Ingress
            metadata:
              name: alloy-faro-collector
              namespace: observability
              annotations:
                alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-northeast-2:297165773875:certificate/38399d86-e76d-4323-9b3d-721b32acd2ce
                alb.ingress.kubernetes.io/group.name: petflow-public
                alb.ingress.kubernetes.io/group.order: "10"
                alb.ingress.kubernetes.io/healthcheck-path: /-/ready
                alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
                alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
                alb.ingress.kubernetes.io/load-balancer-name: petflow-dev-public
                alb.ingress.kubernetes.io/scheme: internet-facing
                alb.ingress.kubernetes.io/ssl-redirect: "443"
                alb.ingress.kubernetes.io/target-type: ip
            spec:
              ingressClassName: alb
              rules:
                - host: leechs.shop
                  http:
                    paths:
                      - path: /collect
                        pathType: Exact
                        backend:
                          service:
                            name: alloy
                            port:
                              number: 12347
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
