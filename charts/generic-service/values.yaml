# 이 파일은 차트 기본값(뼈대)입니다.
# 실제 서비스별 값은 별도 values 레포(values/{env}/services/<service>/values.yaml)에서 덮어씁니다.

nameOverride: ""

image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 1

serviceAccount:
  create: true
  annotations: {}

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

# Spring Boot Actuator 기준 표준 메트릭 경로
metrics:
  enabled: true
  path: /actuator/prometheus
  interval: 15s

ingress:
  enabled: false
  className: nginx
  host: ""
  path: /
  pathType: Prefix
  annotations: {}
  tls:
    enabled: false
    secretName: ""

resources: {}
  # requests:
  #   cpu: 100m
  #   memory: 128Mi
  # limits:
  #   memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

# Argo Rollouts 카나리/블루그린 — 둘 중 하나만 true로 (동시에 켜면 안 됨).
# 둘 다 false면 평범한 Deployment로 배포됨.
canary:
  enabled: false
  steps:
    - setWeight: 10
    - pause: { duration: 60 }
    - setWeight: 50
    - pause: { duration: 60 }
    - setWeight: 100
  analysis:
    enabled: false
    # 비워두면 이 차트가 자동 생성하는 <서비스명>-error-rate AnalysisTemplate을 사용.
    # 도메인 특화 템플릿(예: 예측서비스의 MAPE 기반 템플릿)을 따로 만들어 쓰려면 여기 이름 지정.
    templateName: ""
    # AnalysisTemplate이 참조할 Prometheus 주소 — kube-prometheus-stack 기본 설치 기준
    prometheusAddress: "http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090"

blueGreen:
  enabled: false
  autoPromotionEnabled: false
  scaleDownDelaySeconds: 30

networkPolicy:
  enabled: false
  allowedNamespaces: []

env: []
  # - name: EXAMPLE_ENV
  #   value: "example"

podLabels: {}
podAnnotations: {}
