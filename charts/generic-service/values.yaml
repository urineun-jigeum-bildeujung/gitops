# 이 파일은 차트 기본값(뼈대)입니다.
# 실제 서비스별 값은 별도 values 레포(values/{env}/services/<service>/values.yaml)에서 덮어씁니다.

nameOverride: ""

image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 1

serviceAccount:
  create: true
  annotations: {}

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

resources: {}
  # requests:
  #   cpu: 100m
  #   memory: 128Mi
  # limits:
  #   memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

# Argo Rollouts 카나리 — enabled=true면 Deployment 대신 Rollout 리소스가 생성됨
canary:
  enabled: false
  steps:
    - setWeight: 10
    - pause: { duration: 60 }
    - setWeight: 50
    - pause: { duration: 60 }
    - setWeight: 100
  analysis:
    enabled: false
    templateName: ""

networkPolicy:
  enabled: false
  allowedNamespaces: []

env: []
  # - name: EXAMPLE_ENV
  #   value: "example"

podLabels: {}
podAnnotations: {}
