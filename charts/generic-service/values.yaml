# 이 파일은 차트 기본값(뼈대)입니다.
# 실제 서비스별 값은 별도 values 레포(values/{env}/services/<service>/values.yaml)에서 덮어씁니다.

nameOverride: ""

image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 1

# false면 상시 워크로드(Deployment, canary/blueGreen이면 Rollout)를 만들지 않는다.
# 요청을 받지 않고 cronJobs로만 도는 배치 전용 서비스(recommendation, repurchase 등)용.
# 배치 전용이면 service.enabled, metrics.enabled도 같이 false로 둔다.
deployment:
  enabled: true

serviceAccount:
  create: true
  annotations: {}

service:
  enabled: true
  type: ClusterIP
  port: 80
  targetPort: 8080

# Spring Boot Actuator 기준 표준 메트릭 경로
metrics:
  enabled: true
  path: /actuator/prometheus
  interval: 15s

ingress:
  enabled: false
  className: nginx
  host: ""
  path: /
  pathType: Prefix
  # 비어 있으면 위 단일 path/pathType을 그대로 사용한다. 항목이 있으면 목록만 렌더링한다.
  paths: []
  annotations: {}
  tls:
    enabled: false
    secretName: ""

resources: {}
  # requests:
  #   cpu: 100m
  #   memory: 128Mi
  # limits:
  #   memory: 256Mi

# Kubernetes 원본 affinity 스키마. 비어 있으면 기존 Pod spec을 변경하지 않는다.
# 서비스별 values에서 필요한 워크로드에만 node/pod affinity를 선택적으로 적용한다.
affinity: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

# Argo Rollouts 카나리/블루그린 — 둘 중 하나만 true로 (동시에 켜면 안 됨).
# 둘 다 false면 평범한 Deployment로 배포됨.
canary:
  enabled: false
  steps:
    - setWeight: 10
    - pause: { duration: 60 }
    - setWeight: 50
    - pause: { duration: 60 }
    - setWeight: 100
  analysis:
    enabled: false
    # 비워두면 이 차트가 자동 생성하는 <서비스명>-error-rate AnalysisTemplate을 사용.
    # 도메인 특화 템플릿(예: 예측서비스의 MAPE 기반 템플릿)을 따로 만들어 쓰려면 여기 이름 지정.
    templateName: ""
    # AnalysisTemplate이 참조할 Prometheus 주소 — kube-prometheus-stack 기본 설치 기준
    prometheusAddress: "http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090"

blueGreen:
  enabled: false
  autoPromotionEnabled: false
  scaleDownDelaySeconds: 30

networkPolicy:
  enabled: false
  # 전용 서비스 Namespace의 나머지 Pod도 기본 차단한다. 공유 Namespace에서는 false.
  namespaceDefaultDeny: false
  # Kubernetes 원본 규칙. 빈 목록은 해당 방향 전체 차단이다.
  ingress: []
  egress: []


# 외부 HTTPS CONNECT 목적지를 서비스별로 제한하는 전용 프록시.
# AWS VPC CNI 표준 NetworkPolicy에는 FQDN selector가 없다.
externalEgress:
  enabled: false
  runtime: java # java 또는 node (Node >=22.21.0 필요)
  allowedDomains: []
  image: ubuntu/squid@sha256:6a097f68bae708cedbabd6188d68c7e2e7a38cedd05a176e1cc0ba29e3bbe029
  replicas: 2
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 128Mi

# 서비스 간 mTLS. true로 켜면 platform/00-internal-ca(사설 CA)가 이 서비스 전용
# 인증서(서버+클라이언트 겸용)를 발급한다. 인증서만 발급되는 단계이고, 애플리케이션이
# 그 인증서를 실제로 로드해서 HTTPS로 서빙/호출하게 만드는 건 공통 모듈(다음 단계) 몫.
mtls:
  enabled: false
  # 인증서/클라이언트 TLS는 유지하면서 평문 HTTP로 수신해야 하는 Gateway는 false.
  # 기존 Backend는 이 기본값으로 종전처럼 8443 서버 mTLS를 유지한다.
  server:
    enabled: true

# 비워두면 기존 서비스 Pod spec에는 Probe가 추가되지 않는다.
# 서비스별 values에서 Kubernetes Probe 원본 스키마로 설정한다.
startupProbe: {}
readinessProbe: {}
livenessProbe: {}

# Kafka SASL/SCRAM-SHA-512. true로 켜면 kafka-credentials ExternalSecret(플랫폼
# 91-external-secrets-config가 미리 배달해둔 것)의 자격증명/CA를 마운트·주입한다.
# 접속 주소(SPRING_KAFKA_BOOTSTRAP_SERVERS)는 이 플래그와 무관하게 서비스별
# env에서 직접 지정 - Kafka를 쓰는 서비스가 지금은 2개뿐이라 굳이 여기서 고정하지 않음.
kafka:
  sasl:
    enabled: false

env: []
  # - name: EXAMPLE_ENV
  #   value: "example"

podLabels: {}
podAnnotations: {}

# 서비스 이미지를 그대로 재사용하는 배치/스케줄 작업 (주문 자동확정, 타임딜 상태 전환 등).
# 필요한 서비스만 채워서 쓰고, 없으면 빈 리스트로 둔다 — 항목마다 CronJob이 하나씩 생성됨.
# 배치만 도는 서비스는 위 deployment.enabled: false와 함께 쓴다.
cronJobs: []
  # - name: auto-confirm
  #   schedule: "0 * * * *"
  #   timeZone: "Asia/Seoul"       # 비우면 컨트롤러 기준 시간대(UTC)로 해석됨
  #   command: ["java", "-jar", "app.jar"]
  #   args: ["--spring.profiles.active=batch-auto-confirm"]
  #   suspend: false
  #   concurrencyPolicy: Forbid    # 기본값. 이전 실행이 안 끝났으면 다음 스케줄 건너뜀
  #   restartPolicy: OnFailure     # 기본값
  #   startingDeadlineSeconds: 300      # 스케줄 시각을 놓쳐도 이 시간 안이면 늦게라도 실행
  #   backoffLimit: 2                   # 실패 재시도 횟수 (0이면 재시도 없음)
  #   activeDeadlineSeconds: 3600       # 1회 실행 최대 시간, 넘으면 Job 강제 종료
  #   successfulJobsHistoryLimit: 3
  #   failedJobsHistoryLimit: 3
  #   ttlSecondsAfterFinished: 86400    # 끝난 Job/Pod 자동 정리까지 대기 시간
  #   affinity: {}                 # 비우면 위 전역 affinity 사용
  #   env: []                     # 비우면 위 전역 env 사용
  #   resources: {}                # 비우면 위 전역 resources 사용
  #   volumeMounts: []
  #   volumes: []
