{{- if .Values.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "generic-service.name" . }}
  labels:
    {{- include "generic-service.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
    {{- if and .Values.mtls.enabled .Values.mtls.server.enabled }}
    - name: mtls
      port: 8443
      targetPort: 8443
      protocol: TCP
    {{- end }}
  selector:
    {{- include "generic-service.selectorLabels" . | nindent 4 }}
{{- if .Values.blueGreen.enabled }}
---
# 블루그린 preview 서비스 — Argo Rollouts가 여기 selector를 새 버전 ReplicaSet으로 동적 관리.
# activeService(위)는 계속 안정 버전을 가리키다가, promote 시점에 새 버전으로 전환됨.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "generic-service.name" . }}-preview
  labels:
    {{- include "generic-service.labels" . | nindent 4 }}
    # activeService와 selectorLabels가 동일해서 servicemonitor.yaml이 라벨로만 골라내면
    # 이 preview Service까지 같이 매칭된다. rollout이 promote 상태(변경 없음)일 땐 이
    # Service의 Endpoints가 activeService와 똑같은 파드를 가리키므로, 그대로 두면
    # Prometheus가 같은 파드를 2번 스크랩해서 모든 메트릭이 정확히 2배로 찍힌다
    # (2026-09-29 실제로 auth-service에서 jvm_memory_* 전체가 2배로 나오는 걸로 발견).
    # 이 라벨로 ServiceMonitor의 matchExpressions에서 명시적으로 제외한다.
    app.kubernetes.io/component: preview
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
    {{- if and .Values.mtls.enabled .Values.mtls.server.enabled }}
    - name: mtls
      port: 8443
      targetPort: 8443
      protocol: TCP
    {{- end }}
  selector:
    {{- include "generic-service.selectorLabels" . | nindent 4 }}
{{- end }}
{{- end }}
