{{- if or .Values.canary.enabled .Values.blueGreen.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "generic-service.name" . }}
  labels:
    {{- include "generic-service.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "generic-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "generic-service.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "generic-service.name" . }}
      containers:
        - name: {{ include "generic-service.name" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
          env:
            {{- toYaml .Values.env | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
  strategy:
    {{- if .Values.canary.enabled }}
    canary:
      steps:
        {{- toYaml .Values.canary.steps | nindent 8 }}
      {{- if .Values.canary.analysis.enabled }}
      analysis:
        templates:
          - templateName: {{ .Values.canary.analysis.templateName | default (printf "%s-error-rate" (include "generic-service.name" .)) }}
      {{- end }}
    {{- else if .Values.blueGreen.enabled }}
    blueGreen:
      activeService: {{ include "generic-service.name" . }}
      previewService: {{ include "generic-service.name" . }}-preview
      autoPromotionEnabled: {{ .Values.blueGreen.autoPromotionEnabled }}
      scaleDownDelaySeconds: {{ .Values.blueGreen.scaleDownDelaySeconds }}
    {{- end }}
{{- end }}
