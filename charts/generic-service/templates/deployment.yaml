{{- if and .Values.deployment.enabled (not (or .Values.canary.enabled .Values.blueGreen.enabled)) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "generic-service.name" . }}
  labels:
    {{- include "generic-service.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "generic-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "generic-service.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "generic-service.name" . }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ include "generic-service.name" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
            {{- if and .Values.mtls.enabled .Values.mtls.server.enabled }}
            - containerPort: 8443
              name: mtls
            {{- end }}
          env:
            {{- if .Values.env }}
            {{- toYaml .Values.env | nindent 12 }}
            {{- end }}
            {{- include "generic-service.externalEgressEnv" . | nindent 12 }}
            {{- include "generic-service.mtlsEnv" . | nindent 12 }}
            {{- include "generic-service.kafkaSaslEnv" . | nindent 12 }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or .Values.mtls.enabled .Values.kafka.sasl.enabled }}
          volumeMounts:
            {{- if .Values.mtls.enabled }}
            - name: mtls-cert
              mountPath: /etc/mtls
              readOnly: true
            {{- end }}
            {{- if .Values.kafka.sasl.enabled }}
            - name: kafka-truststore
              mountPath: /etc/kafka-tls
              readOnly: true
            {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if or .Values.mtls.enabled .Values.kafka.sasl.enabled }}
      volumes:
        {{- if .Values.mtls.enabled }}
        - name: mtls-cert
          secret:
            secretName: {{ include "generic-service.name" . }}-mtls-cert
        {{- end }}
        {{- if .Values.kafka.sasl.enabled }}
        - name: kafka-truststore
          secret:
            secretName: kafka-credentials
            # kafka-credentials Secret엔 SASL 비밀번호가 든 JAAS 설정 문자열도 같이
            # 들어있어서(env로만 씀), items로 ca.crt만 골라 마운트한다 - 안 그러면
            # 비밀번호가 파일로도 노출되어 불필요하게 중복 노출됨.
            items:
              - key: ca.crt
                path: ca.crt
        {{- end }}
      {{- end }}
{{- end }}
