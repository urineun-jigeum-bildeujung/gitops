# 수동 일회성 Job. operations는 자동 GitOps 동기화 대상이 아니다.
apiVersion: batch/v1
kind: Job
metadata:
  labels:
    role: repurchase-shadow
    app.kubernetes.io/name: generic-service
    app.kubernetes.io/instance: dev-repurchase
    petflow.io/demo-date: '2026-10-05'
    petflow.io/demo-purpose: test
  name: repurchase-demo-shadow-test-20261005
  namespace: repurchase
spec:
  activeDeadlineSeconds: 1800
  backoffLimit: 0
  suspend: false
  template:
    metadata:
      labels:
        role: repurchase-shadow
        app.kubernetes.io/name: generic-service
        app.kubernetes.io/instance: dev-repurchase
        petflow.io/demo-date: '2026-10-05'
        petflow.io/demo-purpose: test
    spec:
      containers:
      - args:
        - demo-daily-shadow-run
        - --model-directory
        - /models/xgboost_aft
        - --artifact-id
        - ec25eb1bcd8f24ce36a2397c1544cb087cb970af532365de7f8ec900aeb4b7fb
        - --scheduled-time-kst
        - 09:30
        - --run-date-kst
        - '2026-10-05'
        - --allow-shadow-write
        env:
        - name: AWS_REGION
          value: ap-northeast-2
        - name: AWS_DEFAULT_REGION
          value: ap-northeast-2
        - name: HTTP_PROXY
          value: http://generic-service-egress.repurchase.svc.cluster.local:3128
        - name: HTTPS_PROXY
          value: http://generic-service-egress.repurchase.svc.cluster.local:3128
        - name: NO_PROXY
          value: localhost,127.0.0.1,::1,.svc,.svc.cluster.local,169.254.170.23
        - name: REPURCHASE_ORDER_DATABASE_DSN
          valueFrom:
            secretKeyRef:
              key: REPURCHASE_ORDER_DATABASE_DSN
              name: repurchase-shadow-dsns
        - name: REPURCHASE_MEMBER_DATABASE_DSN
          valueFrom:
            secretKeyRef:
              key: REPURCHASE_MEMBER_DATABASE_DSN
              name: repurchase-shadow-dsns
        - name: REPURCHASE_RESULT_DATABASE_DSN
          valueFrom:
            secretKeyRef:
              key: REPURCHASE_RESULT_DATABASE_DSN
              name: repurchase-shadow-dsns
        image: 297165773875.dkr.ecr.ap-northeast-2.amazonaws.com/petflow/repurchase:f0b1186bc21d244ae84c2f9583797bea36c2d4be
        name: batch
        resources:
          limits:
            cpu: '1'
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - mountPath: /models/xgboost_aft
          name: models
          readOnly: true
        imagePullPolicy: Always
      initContainers:
      - args:
        - s3
        - cp
        - s3://petflow-dev-ml-artifacts/repurchase/ec25eb1bcd8f24ce36a2397c1544cb087cb970af532365de7f8ec900aeb4b7fb/manifest.json
        - /models/xgboost_aft/manifest.json
        - --region
        - ap-northeast-2
        - --only-show-errors
        command:
        - aws
        env:
        - name: AWS_REGION
          value: ap-northeast-2
        - name: AWS_DEFAULT_REGION
          value: ap-northeast-2
        - name: HTTP_PROXY
          value: http://generic-service-egress.repurchase.svc.cluster.local:3128
        - name: HTTPS_PROXY
          value: http://generic-service-egress.repurchase.svc.cluster.local:3128
        - name: NO_PROXY
          value: localhost,127.0.0.1,::1,.svc,.svc.cluster.local,169.254.170.23
        - name: AWS_EC2_METADATA_DISABLED
          value: 'true'
        - name: AWS_PAGER
          value: ''
        image: public.ecr.aws/aws-cli/aws-cli:2.27.41
        name: download-manifest
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - mountPath: /models/xgboost_aft
          name: models
          readOnly: false
      - args:
        - s3
        - cp
        - s3://petflow-dev-ml-artifacts/repurchase/ec25eb1bcd8f24ce36a2397c1544cb087cb970af532365de7f8ec900aeb4b7fb/model.json
        - /models/xgboost_aft/model.json
        - --region
        - ap-northeast-2
        - --only-show-errors
        command:
        - aws
        env:
        - name: AWS_REGION
          value: ap-northeast-2
        - name: AWS_DEFAULT_REGION
          value: ap-northeast-2
        - name: HTTP_PROXY
          value: http://generic-service-egress.repurchase.svc.cluster.local:3128
        - name: HTTPS_PROXY
          value: http://generic-service-egress.repurchase.svc.cluster.local:3128
        - name: NO_PROXY
          value: localhost,127.0.0.1,::1,.svc,.svc.cluster.local,169.254.170.23
        - name: AWS_EC2_METADATA_DISABLED
          value: 'true'
        - name: AWS_PAGER
          value: ''
        image: public.ecr.aws/aws-cli/aws-cli:2.27.41
        name: download-model
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - mountPath: /models/xgboost_aft
          name: models
          readOnly: false
      - args:
        - |
          from pathlib import Path
          import hashlib, json
          root = Path('/models/xgboost_aft')
          manifest_bytes = (root / 'manifest.json').read_bytes()
          assert hashlib.sha256(manifest_bytes).hexdigest() == '94eaf7e9fd0ba37bce0ce2d8e67069611b980548d59bcdca8df82a0fdbfdc4a1', 'manifest SHA-256 mismatch'
          manifest = json.loads(manifest_bytes)
          assert manifest['artifact_id'] == 'ec25eb1bcd8f24ce36a2397c1544cb087cb970af532365de7f8ec900aeb4b7fb', 'artifact ID mismatch'
          assert manifest['model_filename'] == 'model.json', 'unexpected model filename'
          assert hashlib.sha256((root / 'model.json').read_bytes()).hexdigest() == manifest['model_sha256'], 'model SHA-256 mismatch'
          from scripts.modeling.artifacts import load_model_artifact
          model = load_model_artifact(root)
          assert model.artifact_id == 'ec25eb1bcd8f24ce36a2397c1544cb087cb970af532365de7f8ec900aeb4b7fb', 'loaded model ID mismatch'
          print(json.dumps({'event': 'repurchase_model_loaded', 'artifact_id': model.artifact_id, 'model_sha256': manifest['model_sha256']}))
        command:
        - python
        - -c
        env:
        - name: AWS_REGION
          value: ap-northeast-2
        - name: AWS_DEFAULT_REGION
          value: ap-northeast-2
        - name: HTTP_PROXY
          value: http://generic-service-egress.repurchase.svc.cluster.local:3128
        - name: HTTPS_PROXY
          value: http://generic-service-egress.repurchase.svc.cluster.local:3128
        - name: NO_PROXY
          value: localhost,127.0.0.1,::1,.svc,.svc.cluster.local,169.254.170.23
        image: 297165773875.dkr.ecr.ap-northeast-2.amazonaws.com/petflow/repurchase:f0b1186bc21d244ae84c2f9583797bea36c2d4be
        name: verify-model
        resources:
          limits:
            cpu: '1'
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - mountPath: /models/xgboost_aft
          name: models
          readOnly: true
        imagePullPolicy: Always
      restartPolicy: Never
      securityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: generic-service
      volumes:
      - emptyDir:
          sizeLimit: 128Mi
        name: models
