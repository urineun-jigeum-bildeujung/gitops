# 서비스용 ApplicationSet — values 레포의 values/{env}/services/* 디렉토리를 스캔해서
# 폴더가 생기는 만큼 자동으로 서비스별 Application을 만들어냄.
# values 레포: https://github.com/urineun-jigeum-bildeujung/gitops-value (public, 2026-09-09 생성)
#
# goTemplate: true가 반드시 필요 — 이게 없으면 아래 {{.xxx}} 문법(점 표기)이 작동하지 않음.
#
# 새 서비스를 추가할 때는 values 레포에 values/{env}/services/<service-name>/ 폴더를 복사해서 만들면 됨.
# `_`로 시작하는 폴더(예: _template)는 git generator에서 exclude되어 Application이 자동 생성되지 않음
# — 새 서비스 만들 때 복사해갈 템플릿 폴더 용도로 남겨두는 컨벤션.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: services
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - list:
              elements:
                - env: dev
                # - env: prod   # TODO: prod 환경 확정되면 추가
          - git:
              repoURL: https://github.com/urineun-jigeum-bildeujung/gitops-value.git
              revision: main
              directories:
                - path: "values/{{.env}}/services/*"
                - path: "values/{{.env}}/services/_*"
                  exclude: true
  template:
    metadata:
      name: "{{.env}}-{{.path.basename}}"
      annotations:
        # platform(namespaces/rbac/observability/cnpg/keda/external-secrets)이 전부
        # sync된 뒤 서비스가 뜨도록 wave 10 — 그래야 DB/시크릿 의존성이 준비된 상태에서
        # 서비스 pod이 시작되어 CrashLoopBackOff를 피함.
        argocd.argoproj.io/sync-wave: "10"
    spec:
      project: services
      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas
        - group: argoproj.io
          kind: Rollout
          jsonPointers:
            - /spec/replicas
      sources:
        - repoURL: https://github.com/urineun-jigeum-bildeujung/gitops.git
          targetRevision: main
          path: charts/generic-service
          helm:
            valueFiles:
              - $values/{{.path.path}}/values.yaml
        - repoURL: https://github.com/urineun-jigeum-bildeujung/gitops-value.git
          targetRevision: main
          ref: values
      destination:
        server: https://kubernetes.default.svc
        # platform/05-namespaces가 wave -9에서 이 이름들을 이미 만들어둠.
        # CreateNamespace=true는 그래도 안전망으로 유지(여기서 이름이 틀리면 즉시 알아챌 수 있게
        # 05-namespaces와 반드시 동일한 이름을 써야 함).
        namespace: "{{.path.basename}}"
      # HPA가 Deployment/Rollout의 spec.replicas를 직접 바꾸는데, selfHeal이 켜져 있으면
      # ArgoCD가 이걸 git의 replicaCount와 다르다고 판단해 되돌려버려 HPA와 계속 충돌한다.
      # ignoreDifferences로 그 필드를 아예 관리 대상에서 빼고(RespectIgnoreDifferences=true로
      # sync 시점에도 덮어쓰지 않게 함), replicas의 실제 소유권을 HPA(없으면 마지막 kubectl
      # scale 값)에 넘긴다. 부작용: HPA 없는 서비스도 같이 적용되므로, 그런 서비스는 이제
      # values.yaml의 replicaCount를 바꿔도 GitOps sync로 반영되지 않는다 — kubectl scale로
      # 직접 하거나 그때만 일시적으로 이 설정을 빼야 한다.
      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas
        - group: argoproj.io
          kind: Rollout
          jsonPointers:
            - /spec/replicas
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - RespectIgnoreDifferences=true
