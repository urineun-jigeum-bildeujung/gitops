configs:
  cm:
    url: https://argocd.leechs.shop

repoServer:
  # 초기 GitOps 동기화에서 여러 Helm 차트를 렌더링할 때 상태 검사 시간 초과로
  # repo-server가 반복 재시작되지 않도록 부팅 시간과 응답 시간을 확보한다.
  # apply테스트에서 계속된 재시작으로 동시성 제한 추가
  extraArgs:
    - --parallelismlimit=2
  startupProbe:
    enabled: true
    timeoutSeconds: 5
  readinessProbe:
    timeoutSeconds: 5
  livenessProbe:
    timeoutSeconds: 10
    failureThreshold: 6

server:
  ingress:
    enabled: true
    controller: generic
    ingressClassName: alb
    hostname: argocd.leechs.shop
    path: /
    pathType: Prefix
    tls: false
    annotations:
      alb.ingress.kubernetes.io/backend-protocol: HTTPS
      alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-northeast-2:297165773875:certificate/38399d86-e76d-4323-9b3d-721b32acd2ce
      alb.ingress.kubernetes.io/group.name: petflow-dev-management
      alb.ingress.kubernetes.io/group.order: "10"
      alb.ingress.kubernetes.io/healthcheck-path: /healthz
      alb.ingress.kubernetes.io/healthcheck-port: traffic-port
      alb.ingress.kubernetes.io/healthcheck-protocol: HTTPS
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
      alb.ingress.kubernetes.io/load-balancer-name: petflow-dev-management
      alb.ingress.kubernetes.io/manage-backend-security-group-rules: "true"
      alb.ingress.kubernetes.io/scheme: internal
      alb.ingress.kubernetes.io/security-groups: petflow-dev-management-alb
      alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-2016-08
      alb.ingress.kubernetes.io/success-codes: "200"
      alb.ingress.kubernetes.io/target-type: ip
